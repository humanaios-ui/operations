# research-intake.yml
# HumanAIOS Research Intake Protocol v0.2  (post red-team 2026-09-08; v0.1 did not parse — RT-11)
# Specimen: pseudonymous. Legal name and platform contract id are held in a private
# specimen register outside this public repository (RT-07). Keyed by specimen_id.
# Tier: 2 (ADV run required before OPERATED)

schema_version: "0.2"
protocol_name: "research-intake"
intake_type: "behavioral-specimen"
specimen_id: "SPC-01"
specimen_role: "individual expert contractor, external annotation/evaluation platform"
specimen_register: "private (not in tree); maps specimen_id -> identity, contract"

# ---------------------------------------------------------------------------
# Research questions. Every measurement is on a bounded [0,1] scale so the
# Brier thresholds mean something (v0.1 used raw squared error — RT-01).
# ---------------------------------------------------------------------------
research_questions:
  RQ1:
    title: "Does behavioral assessment predict expert task performance?"
    hypothesis: "Engagement signals (acceptance, revision cycles, velocity) forecast next-window quality."
    measurement: "Mean Brier over resolved forecasts (normalised error^2 in [0,1]); REVERT rate."
    falsifier: "After >=10 resolved forecasts: mean Brier > 0.4 OR REVERT rate > 30%."
    measurement_window: "30 days rolling (cycles 1-5)"
  RQ2:
    title: "Can resource allocation be reproduced from behavioral data?"
    hypothesis: "CredPolicy regulator forecasts the specimen's next task category without discretion."
    measurement: "Agreement between CredPolicy predicted_choice (registered before disclosure) and actual_choice, per cycle."
    falsifier: "Agreement < 60% on 3+ consecutive measured cycles."
    measurement_window: "30 days rolling (cycles 2-5)"
    known_confound: "Specimen sees the recommendation (RQ3 intervention). disclosed_at is recorded; agreement is reported both raw and for cycles where actual_choice preceded disclosure."
  RQ3:
    title: "Does intake evaluation itself improve performance (audit-as-molt, F-41)?"
    hypothesis: "Being audited raises subsequent quality."
    measurement: "Quality score delta cycle-over-cycle; rejection rate trend."
    falsifier: "No quality improvement across 2 consecutive cycles, or rejection rate rises."
    measurement_window: "14 days per cycle"

# ---------------------------------------------------------------------------
# Standing limitations (stated, not hidden — VAL-12)
# ---------------------------------------------------------------------------
limitations:
  - id: L1
    text: "The specimen is also Z2. Z2 ratifies the audit of Z2's own behaviour. Mitigation: ratification binds only the receipt hash (inputs + forecasts as issued); resolutions are mechanical and cannot be edited after ratification. Independent review of resolution inputs is an open gap (GAP-RI-01)."
  - id: L2
    text: "n=1 specimen. Results characterise the pipeline, not the population. No generalisation claim is registrable from this study."
  - id: L3
    text: "Platform data (task counts, quality feedback) may be confidential under the specimen's contractor agreement. Only aggregates on [0,1] scales enter this repository; raw exports stay in the private register. Z2 to confirm against contract terms before Cycle 1 (BLOCKER B1)."

# ---------------------------------------------------------------------------
# Intake record schema (field: type — documentation; enforced by the dataclasses
# in research_intake_evaluator.py, which is the executable form)
# ---------------------------------------------------------------------------
intake_record_schema:
  metadata:
    intake_id: "string  intake-{specimen_id}-c{cycle}-{utc timestamp}"
    cycle_number: "int"
    specimen_id: "string"
    timestamp: "datetime (tz-aware)"
    evaluator: "Z1 | Z2"
    evaluation_status: "PENDING | PRELIMINARY | VERIFIED | PUBLISHED | REVERTED"
  specimen_input:
    work_period_start: "datetime"
    work_period_end: "datetime"
    platform: "string"
    tasks_assigned: "int"
    tasks_completed: "int"
    tasks_revised: "int"
    task_categories: "list[string]"
    verification_sources: "list[string]  e.g. platform-export:<sha256>. Empty => receipt_status CLAIM"
  behavioral_observations:
    engagement:
      task_acceptance_rate: "float [0,1]"
      revision_cycles_per_task: "float"
      response_time_minutes: "float"
      quality_score: "float [0,100] | null"
    consistency:
      guideline_adherence: "float [0,1]"
      annotation_variance: "float [0,1]"
      error_rate: "float [0,1]"
    learning_signal:
      revision_acceptance_rate: "float [0,1]"
      improvement_trajectory: "IMPROVING | STABLE | DECLINING | NO_DATA"
      confidence_trend: "increasing | stable | decreasing"
  molt_predictions:
    item:
      prediction_id: "string"
      variable: "string"
      prediction_value: "float [0,1] (normalised; scale_max maps to raw)"
      confidence: "float [0,1]"
      measurement_window_days: "int"
      predicted_at: "datetime"
      revert_rule: "{kind: abs_below|abs_above|equals, threshold: float}  — evaluated by code, never prose"
      scale_max: "float"
      binary: "bool"
      resolved_at: "datetime | null"
      actual_value: "float [0,1] | null"
      brier_score: "float [0,1] | null"
      reverted: "bool"
  credential_policy_output:
    priority_score: "float [0,100]"
    recommended_next_tasks: "list[string]"
    envelope_constraint: "string"
    rationale: "string"
    predicted_choice: "string"
    registered_at: "datetime  (forecast is committed here, inside the receipt hash)"
    disclosed_at: "datetime | null  (when the specimen saw it)"
    actual_choice: "string | null"
    agreement: "bool | null"
  receipt_and_hash:
    receipt_hash: "sha256 over the COMMITMENT: metadata, inputs, observations, forecast commitments, CredPolicy commitment, chain_link_prior"
    resolution_hash: "sha256 over resolutions, keyed to receipt_hash (separate so the receipt is stable)"
    receipt_status: "CLAIM | CLAIM_WITH_LINK | VERIFIED | VOID  — earned from verification_sources, never asserted"
    chain_link_prior: "receipt_hash of the previous published cycle (inside the hash — RT-02)"
  ratification:
    ratification_hash: "sha256(receipt_hash | ratified_by | ratified_at)  — produced by Z2 out of band; code verifies only"
    ratified_by: "string"
    ratified_at: "datetime"

# ---------------------------------------------------------------------------
# Cycle cadence
# ---------------------------------------------------------------------------
cycle_schedule:
  cycle_frequency: "weekly"
  first_cycle_start: "2026-09-13"
  cycle_duration_days: 7
  evaluation_lag_hours: 24
  z2_ratification_lag_hours: 48
  molt_window_days: 30
  publication_gate: "a record publishes only with a ratification hash that binds to its receipt hash"
  measurement_gate: "resolutions are mechanical (resolve_cycle); a tripped revert_rule emits REVERT + F/IC candidate without a ruling"

# ---------------------------------------------------------------------------
# Landing
# ---------------------------------------------------------------------------
landing:
  tier: 2
  landing_order_position: 2
  landed_commit: "c08f86c (v0.1, direct push to main — bypassed PR rule and required check; see IC candidate in red-team report)"
  dependencies:
    - "ADV run on research_intake_evaluator.py forecast + revert logic"
    - "MOLT_LEDGER schema ratified"
    - "NF_LEDGER Brier engine (v0.2 in-module implementation is the candidate)"
  blockers:
    - id: B1
      text: "Z2 confirms platform data may be aggregated into this public repo under the contractor agreement"
    - id: B2
      text: "Private specimen register created (specimen_id -> identity/contract) outside the tree"
    - id: B3
      text: "Z2 ratifies falsifiers, windows, and the constants PRIOR_QUALITY / PRIOR_ACCEPTANCE / SHRINK"
  not_blocking:
    - "expert work scope — task_categories are free-form and captured per cycle"

audit_trail:
  - date: "2026-09-08"
    event: "red-team of v0.1; 11 findings; v0.2 issued with regression tests"
    ref: "research-intake_redteam_090826.md"

z2_ratification:
  ratified_by: null
  ratified_at: null
  ratification_hash: null
  status: "PENDING"
