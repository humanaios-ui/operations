[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "humanaios-mcp-service"
version = "0.1.1"
description = "Bounded, read-only MCP interface to the HumanAIOS Unit Zero conversational agent"
requires-python = ">=3.10"
dependencies = ["mcp>=2.2,<3", "anthropic>=0.60,<2"]

[project.scripts]
haios-mcp = "haios_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
