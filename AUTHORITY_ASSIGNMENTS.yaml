## Collection Process

1. Each practice designates Z2 authority (primary + optional backup)
2. Reply to AUTHORITY_COLLECTION_FORM.md by 2026-08-03
3. Operations repo updates AUTHORITY_ASSIGNMENTS.yaml with all responses
4. Admiral confirms all assignments
5. Phase 2 begins with Z2 authorities identified + trained

---

## Authority Responsibilities

Once confirmed, Z2 authorities commit to:
- Review governance PRs within SLA (24h-72h depending on type)
- Answer 5 gate questions before merge approval
- Represent practice in cross-practice governance decisions
- Monitor divergence-detect reports (daily consistency checks)
- Merge mesh-sync-batch PRs within 24h of receipt
