schema_version: "0.1"
oracle_id: ORACLE-DOMAIN-RESOURCE
oracle_class: DOMAIN_ORACLE
domain: resource
tracking_issue: 735
state: LAID

authority:
  advisory_only: true
  can_authorize: false
  authority_effect: NONE
  can_ratify: false
  can_merge: false

purpose: Maintain the resource/opportunity graph from opportunity through requirement, resource, suitability, authorization candidate, execution observation, and outcome.

source_oracles:
  - ORACLE-SOURCE-DRIVE
  - ORACLE-SOURCE-GITHUB

entity_focus:
  - OPPORTUNITY
  - REQUIREMENT
  - RESOURCE
  - SUITABILITY
  - AUTHORIZATION_CANDIDATE
  - OUTCOME
  - RECEIPT

may:
  - map_opportunity_to_requirement
  - map_requirement_to_resource
  - classify_suitability_evidence
  - detect_missing_authorization
  - preserve_observed_outcome
  - emit_graph_delta

may_not:
  - claim_ownership_from_match
  - authorize_claim_or_submission
  - execute_financial_or_external_action
  - ratify
  - commit
  - merge

outputs:
  graph_projection: RESOURCE_ADVISORY_GRAPH
  authority_effect: NONE
