schema_version: "0.1"
oracle_id: ORACLE-DOMAIN-GOVERNANCE
oracle_class: DOMAIN_ORACLE
domain: governance
tracking_issue: 735
state: LAID

authority:
  advisory_only: true
  can_authorize: false
  authority_effect: NONE
  can_ratify: false
  can_merge: false

purpose: Project observed policies, warrants, decisions, authority boundaries, admission requirements, and supersession without exercising those authorities.

source_oracles:
  - ORACLE-SOURCE-GITHUB
  - ORACLE-SOURCE-DRIVE

entity_focus:
  - DOCTRINE
  - WARRANT
  - DECISION
  - POLICY
  - ADMISSION_REQUIREMENT
  - INCIDENT

may:
  - identify_applicable_policy
  - detect_policy_conflict
  - detect_missing_warrant_or_decision
  - map_decision_supersession
  - emit_graph_delta

may_not:
  - create_warrant
  - authorize_act
  - ratify
  - merge
  - convert_policy_match_into_execution_permission

outputs:
  graph_projection: GOVERNANCE_ADVISORY_GRAPH
  authority_effect: NONE
