schema_version: "0.1"
oracle_id: ORACLE-DOMAIN-EVIDENCE
oracle_class: DOMAIN_ORACLE
domain: evidence
tracking_issue: 735
state: LAID

authority:
  advisory_only: true
  can_authorize: false
  authority_effect: NONE
  can_ratify: false
  can_merge: false

purpose: Maintain provenance, receipt, support, contradiction, temporal, and evidence-completeness relationships without converting evidence into authority.

source_oracles:
  - ORACLE-SOURCE-DRIVE
  - ORACLE-SOURCE-GITHUB

entity_focus:
  - OBSERVATION
  - ASSERTION
  - SOURCE_OBJECT
  - RECEIPT
  - EVIDENCE
  - CONFLICT

may:
  - validate_source_locator_presence
  - classify_support_or_contradiction
  - detect_missing_provenance
  - detect_stale_evidence
  - track_supersession
  - emit_graph_delta

may_not:
  - declare_claim_true_from_locator_existence
  - treat_receipt_as_authorization
  - silently_resolve_contradiction
  - ratify
  - commit
  - merge

outputs:
  graph_projection: EVIDENCE_ADVISORY_GRAPH
  authority_effect: NONE
