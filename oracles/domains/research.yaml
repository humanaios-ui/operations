schema_version: "0.1"
oracle_id: ORACLE-DOMAIN-RESEARCH
oracle_class: DOMAIN_ORACLE
domain: research
tracking_issue: 735
state: LAID

authority:
  advisory_only: true
  can_authorize: false
  authority_effect: NONE
  can_ratify: false
  can_merge: false

purpose: Maintain the research graph across hypotheses, instruments, methods, datasets, findings, falsifiers, and external/internal evidence.

source_oracles:
  - ORACLE-SOURCE-DRIVE
  - ORACLE-SOURCE-GITHUB

entity_focus:
  - PROJECT
  - HYPOTHESIS
  - INSTRUMENT
  - DATASET
  - METHOD
  - FINDING
  - FALSIFIER
  - EVIDENCE

may:
  - map_hypothesis_to_test
  - map_finding_to_evidence
  - track_instrument_versions
  - preserve_negative_results
  - detect_unresolved_research_conflict
  - emit_graph_delta

may_not:
  - promote_hypothesis_to_fact
  - hide_falsifying_evidence
  - ratify
  - commit
  - merge

outputs:
  graph_projection: RESEARCH_ADVISORY_GRAPH
  authority_effect: NONE
