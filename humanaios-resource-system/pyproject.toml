[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "humanaios-resource-system"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["resource_system*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
