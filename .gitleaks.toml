title = "HumanAIOS gitleaks configuration"

# Extends the default ruleset rather than replacing it. Every stock rule stays
# active; this file only narrows one demonstrated false positive.
[extend]
useDefault = true

# ─────────────────────────────────────────────────────────────────────────────
# NF_LEDGER mesh token identifiers
#
# `generic-api-key` fires on RESOLVE rows in ledgers/NF_LEDGER.jsonl because the
# JSON key is literally `token_id` and the value is a longish hyphenated string
# (entropy ~3.8-4.0). The values are mesh practice identifiers of the form
# T-<practice-slug>-<NN>, e.g. T-empirica-outreach-01. They are not credentials:
# the same identifiers are already committed in public in
# ledgers/mesh_pins_090826.json and in this ledger's own TOKEN and PIN rows.
# The rows only tripped the scanner now because gitleaks scans a PR's commit
# range, and the first RESOLVE events in the ledger's history landed in it.
#
# The allowlist is deliberately NOT a path exclusion. Excluding
# ledgers/NF_LEDGER.jsonl would blind the scanner to a genuine secret pasted
# into that file later — and a ledger carrying tree-read sources is exactly the
# kind of file a path or token could be pasted into by accident. Instead the
# regex requires BOTH the `token_id` key AND the T-slug-NN identifier shape, so:
#
#   * a high-entropy value under any other key still trips,
#   * a value under `token_id` that is not a mesh identifier still trips,
#   * a secret anywhere else in this file still trips.
#
# Verified locally against gitleaks 8.28.0: 3 findings before, 0 after, and the
# control case below still reports.
[allowlist]
description = "NF_LEDGER mesh token identifiers (T-<practice>-<NN>) are public IDs, not credentials"
regexTarget = "match"
regexes = ['''token_id":\s*"T-[a-z0-9]+(?:-[a-z0-9]+)*-\d{2}"''']
