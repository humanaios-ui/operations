# HumanAIOS — Z1 Inbox Index (Single Source of Truth)
#
# What this is: the conversion record for z1-inbox/. Every file dropped in the
# inbox is either a CANDIDATE (it asks Z2 for a decision) or a RECORD (it
# reports, receipts, or hands off — no decision requested). This file says
# which, and for candidates it carries the decision state.
#
# Why it is a sidecar and not frontmatter: z1-inbox/2026-09-06/MANIFEST.md sets
# the inbox convention as "append-only; a correction is a new dated folder,
# never an edit." Writing frontmatter into 24 existing dated drops would be an
# edit to each. The metadata lives here instead, the same shape
# document-registry.yaml and tools-manifest.yaml already use, and
# `.z1-control/validate.py` enforces that this file and the tree agree.
#
# `decision_due` is DERIVED (submitted + the 48h Z2 window from CLAUDE.md) and
# is recomputed by the validator — do not hand-set it to buy time.
#
# `status: ratified | edit_requested | rejected` is Z2's act. The validator
# refuses any of them without `ratified_by`, `ratified_at`, and a `z2_ruling`
# that resolves to a real file — Z1 cannot sign for Z2, the same no-self-grant
# rule .tool-control/validate.py already enforces for the Z2 tool waiver.
