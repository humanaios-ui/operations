schema: candidate-bundle/v1
candidate_id: Q-MOLT-ADMISSION-AUTOSWEEP-01
type: MOLT
title: Capacity-bounded auto-admission of ADVANCE-classified PRs
area: repository-coordinator
visibility: shared
impact: 8
reversibility: committal

description: |
  ## Problem

  The repository admission gate (`repository-admission-gate.yml` →
  `tools/repository_coordinator_v0_1.py`) computes two independent axes per PR:

  - **action** — technical readiness (`ADVANCE` = no coordinator-level blocker)
  - **lane** — standing (`ADMISSION_REVIEW` = no admission record exists)

  `admission_gate = FAIL` whenever `lane == ADMISSION_REVIEW`, **regardless of
  action**. The only writer of an admission record is a manual, per-PR operator
  command (`/coordinator admit` → `coordinator-issue-route.yml` → dispatch →
  gate mutate job → hash-chained ADMIT event on the `repository-coordinator-state`
  branch). There is no mechanism that admits a PR the coordinator itself has
  already classified `ADVANCE`.

  **Consequence (observed 2026-10-15):** ~20 ready, `ADVANCE`-classified PRs
  (#770, #771, #884, #888, #889, …) sit permanently in `ADMISSION_REVIEW` with
  `gate: FAIL / reason: "ready non-maintenance work has no explicit admission
  record"`. Because the only branch-protection-required check is `guard`, the
  admission gate is non-blocking in practice, so every clean PR is merged via
  admin override — the gate degrades into noise it was built to prevent. Supply
  of admissions (one manual gesture) cannot match demand (the ready queue).
  Capacity is not the constraint: `active_operator_queue_limit = 9` with only a
  couple of genuinely-open admitted PRs.

  ## Decision

  Add a **capacity-bounded auto-admission sweep** (`coordinator-admission-sweep.yml`,
  scheduled + `workflow_dispatch`) that:

  1. Builds the full-queue snapshot and runs the existing coordinator index
     (`repository_coordinator_v0_1.py`, no new classification code).
  2. Selects PRs where `lane == ADMISSION_REVIEW` **and** `guidance.action ==
     ADVANCE` **and** zero HIGH findings **and** admitting keeps the open-admitted
     ready count within `capacity.active_operator_queue_limit`.
  3. Admits each selected PR **through the already-trusted gate mutate path**
     (dispatch `repository-admission-gate.yml` with `decision=ADMIT`). The sweep
     writes nothing to the ledger itself — it is a selector; the existing hash-
     chained append remains the sole writer.

  ## Authority boundary (unchanged)

  Admission stays `authority_effect: ADMISSION_ROUTING_ONLY`, `merge_authority:
  false`. Auto-admission is a CLAIM record ("coordinator auto-admitted an ADVANCE
  PR within capacity"), never a merge decision. The required `guard` check and Z2
  are unaffected. PRs over the capacity line stay in `ADMISSION_REVIEW` — honest
  backpressure, honoring the invariant
  `AUTONOMOUS_PRODUCTION_CANNOT_OUTRUN_REVIEW_CAPACITY`.

  ## Revert posture

  Ships inert: gated behind repository variable
  `COORDINATOR_AUTOSWEEP_ENABLED` (default unset → dry-run). Z2 activates by
  setting it `true` after ratification; reverting is setting it back to `false`
  (no code change, no ledger rewrite).

  ## Rejected alternatives

  - **Treat `ADVANCE` as implicit gate PASS** — makes admission implicit,
    destroying the ledger-as-single-source-of-admission-truth and the objective-
    claim guarantee. Wrong layer.
  - **Manual batch `/coordinator admit-ready`** — useful companion for immediate
    relief, but still needs a human per sweep; does not close the supply gap.

falsifier: >
  Within 30 days of activation (repository variable
  COORDINATOR_AUTOSWEEP_ENABLED set true), any of: (a) an auto-admitted PR reaches
  merge while holding a duplicate-objective or competing-implementation finding;
  (b) an ADMIT event is written by the sweep for a PR carrying any HIGH coordinator
  finding, or that pushes the open-admitted ready count beyond
  active_operator_queue_limit; (c) the sweep emits any event that is not
  ADMISSION_ROUTING_ONLY / merge_authority=false. Any occurrence files an IC
  candidate and reverts the sweep (set COORDINATOR_AUTOSWEEP_ENABLED false).

evidence:
  - ".github/workflows/repository-admission-gate.yml (gate + mutate writer)"
  - ".github/workflows/coordinator-issue-route.yml (/coordinator admit router)"
  - "tools/repository_coordinator_v0_1.py:649 (ADMISSION_REVIEW → FAIL reason)"
  - "ADMISSION_LEDGER.jsonl (v2 hash-chained ADMIT events; #843, #873)"
  - "COORDINATOR_STATE.json (admitted set; active_operator_queue_limit=9)"
  - "PR #889 decision receipt: decision=FAIL lane=ADMISSION_REVIEW"
  - "COORDINATION_PROTOCOL.md Rule 1 (CLAIM before you work)"
