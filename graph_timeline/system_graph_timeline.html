<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>System Graph Timeline</title>
<style>
:root{--bg:#fbfaf7;--fg:#1d1d1b;--mute:#6b6a64;--line:#c9c6bd;--pulse:#d1495b;
--z1:#2a7fba;--z2:#c46b1a;--z3:#3f8f5a;--zc:#7a5ea8;--zx:#8a8a85}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--fg:#ecebe6;--mute:#9c9b95;--line:#3a3c40;--pulse:#ff7b8a;--z1:#5aa9e6;--z2:#e8924a;--z3:#6cc38a;--zc:#b596e0;--zx:#a5a5a0}}
:root[data-theme="dark"]{--bg:#17181a;--fg:#ecebe6;--mute:#9c9b95;--line:#3a3c40;--pulse:#ff7b8a;--z1:#5aa9e6;--z2:#e8924a;--z3:#6cc38a;--zc:#b596e0;--zx:#a5a5a0}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
main{max-width:960px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:var(--mute);font-size:13px;margin-bottom:10px}
svg{width:100%;height:auto;display:block}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
button{font:inherit;padding:6px 14px;border:1px solid var(--line);background:none;color:var(--fg);border-radius:6px;cursor:pointer}
input[type=range]{flex:1;min-width:160px}
#date{font-variant-numeric:tabular-nums;min-width:110px;font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.stats{font-size:13px;color:var(--mute);margin-top:6px}
.edge{stroke:var(--line);stroke-width:1.2;transition:opacity .4s}
.node{transition:opacity .5s}
.label{fill:var(--fg);font-size:11px;pointer-events:none}
.fb{stroke-dasharray:3 3}
@media (max-width:480px){.label{font-size:13px}}
</style></head>
<body><main>

<div class="sub" id="sub"></div>

  <input type="range" id="t" min="0" max="0" step="1" value="0" aria-label="Date">
  <span id="date"></span>
</div>
<div class="stats" id="stats"></div>
<div class="legend" id="legend"></div>
</main>

"], "first_seen": "2026-09-10", "last_changed": "2026-09-10", "date_source": "git"}, {"id": "AG", "name": "Agent Runtime", "zone": "code", "type": "process", "status": "LAID", "files": ["agent_core.py"], "commit_count": 1, "commit_dates": ["2026-09-10"], "first_seen": "2026-09-10", "last_changed": "2026-09-10", "date_source": "git"}, {"id": "CIG", "name": "CI Integration Gate", "zone": "CI", "type": "gate", "status": "OPERATED", "files": [".github/workflows/z2_ratification_gate.yml", "ci_gates.py", "z2_ratification_gate.yml"], "commit_count": 9, "commit_dates": ["2026-09-10", "2026-09-11", "2026-09-13", "2026-09-21", "2026-09-23", "2026-09-25", "2026-10-09"], "first_seen": "2026-09-10", "last_changed": "2026-10-09", "date_source": "git"}, {"id": "MOLT", "name": "Molt Cycle", "zone": "code", "type": "process", "status": "LAID", "files": ["molt_cycle.py"], "commit_count": 4, "commit_dates": ["2026-09-10", "2026-09-13", "2026-09-28"], "first_seen": "2026-09-10", "last_changed": "2026-09-28", "date_source": "git"}, {"id": "PRS", "name": "PRS Runner", "zone": "code", "type": "process", "status": "LAID", "files": ["prs_run.py"], "commit_count": 2, "commit_dates": ["2026-09-10"], "first_seen": "2026-09-10", "last_changed": "2026-09-10", "date_source": "git"}, {"id": "Q", "name": "Priority Queue", "zone": "Z2", "type": "process", "status": "OPERATED", "files": ["priority_queue_engine.py"], "commit_count": 3, "commit_dates": ["2026-09-10", "2026-09-13"], "first_seen": "2026-09-10", "last_changed": "2026-09-13", "date_source": "git"}, {"id": "RC", "name": "Receipt Reconciliation", "zone": "code", "type": "ritual", "status": "LAID", "files": ["receipt_reconciliation.py", "tools/receipt_reconciliation.py"], "commit_count": 2, "commit_dates": ["2026-09-10", "2026-09-21"], "first_seen": "2026-09-10", "last_changed": "2026-09-21", "date_source": "git"}, {"id": "ST", "name": "Stale Sweep", "zone": "code", "type": "process", "status": "LAID", "files": ["stale_sweep.py"], "commit_count": 2, "commit_dates": ["2026-09-10"], "first_seen": "2026-09-10", "last_changed": "2026-09-10", "date_source": "git"}, {"id": "RCEN", "name": "Resource Census", "zone": "Z1", "type": "process", "status": "OPERATED", "files": ["tools/resource_census_v0_1.py"], "commit_count": 2, "commit_dates": ["2026-09-13"], "first_seen": "2026-09-13", "last_changed": "2026-09-13", "date_source": "git"}, {"id": "RL", "name": "Resource Ledger", "zone": "code", "type": "ledger", "status": "LAID", "files": ["ledgers/RESOURCE_LEDGER.jsonl", "tools/resource_ledger_v0_1.py"], "commit_count": 5, "commit_dates": ["2026-09-13"], "first_seen": "2026-09-13", "last_changed": "2026-09-13", "date_source": "git"}, {"id": "RU", "name": "Resource Units", "zone": "Z2", "type": "ledger", "status": "LAID", "files": ["RESOURCE_UNITS.yaml"], "commit_count": 4, "commit_dates": ["2026-09-13"], "first_seen": "2026-09-13", "last_changed": "2026-09-13", "date_source": "git"}], "edges": [{"source": "Q", "target": "PRS", "edge_type": "control_flow", "first_seen": "2026-09-10"}, {"source": "Q", "target": "AG", "edge_type": "control_flow", "first_seen": "2026-09-10"}, {"source": "Q", "target": "OM", "edge_type": "control_flow", "first_seen": "2026-09-10"}, {"source": "Q", "target": "ADV", "edge_type": "control_flow", "first_seen": "2026-09-10"}, {"source": "PRS", "target": "EV", "edge_type": "data_flow", "first_seen": "2026-09-10"}, {"source": "AG", "target": "EV", "edge_type": "data_flow", "first_seen": "2026-09-10"}, {"source": "ADV", "target": "EV", "edge_type": "data_flow", "first_seen": "2026-09-10"}, {"source": "TC", "target": "EV", "edge_type": "data_flow", "first_seen": "2026-09-07"}, {"source": "PRS", "target": "NF", "edge_type": "data_flow", "first_seen": "2026-09-10"}, {"source": "OM", "target": "NF", "edge_type": "data_flow", "first_seen": "2026-09-08"}, {"source": "EV", "target": "FS", "edge_type": "data_flow", "first_seen": "2026-09-07"}, {"source": "FS", "target": "Z2", "edge_type": "control_flow", "first_seen": "2026-09-07"}, {"source": "OM", "target": "Z2", "edge_type": "control_flow", "first_seen": "2026-09-07"}, {"source": "PRS", "target": "Z2", "edge_type": "data_flow", "first_seen": "2026-09-10"}, {"source": "Z2", "target": "CIG", "edge_type": "control_flow", "first_seen": "2026-09-10"}, {"source": "CIG", "target": "REG", "edge_type": "control_flow", "first_seen": "2026-09-10"}, {"source": "REG", "target": "PRS", "edge_type": "data_flow", "first_seen": "2026-09-10"}, {"source": "REG", "target": "FS", "edge_type": "data_flow", "first_seen": "2026-09-07"}, {"source": "REG", "target": "Q", "edge_type": "data_flow", "first_seen": "2026-09-10"}, {"source": "REG", "target": "MOLT", "edge_type": "data_flow", "first_seen": "2026-09-10"}, {"source": "RC", "target": "Q", "edge_type": "callout", "first_seen": "2026-09-10"}, {"source": "ST", "target": "OM", "edge_type": "callout", "first_seen": "2026-09-10"}, {"source": "ST", "target": "Q", "edge_type": "callout", "first_seen": "2026-09-10"}, {"source": "NF", "target": "Q", "edge_type": "data_flow", "first_seen": "2026-09-10"}, {"source": "TC", "target": "Q", "edge_type": "callout", "first_seen": "2026-09-10"}, {"source": "NF", "target": "MOLT", "edge_type": "data_flow", "first_seen": "2026-09-10"}, {"source": "EV", "target": "MOLT", "edge_type": "data_flow", "first_seen": "2026-09-10"}, {"source": "Q", "target": "MOLT", "edge_type": "data_flow", "first_seen": "2026-09-10"}, {"source": "ST", "target": "MOLT", "edge_type": "data_flow", "first_seen": "2026-09-10"}, {"source": "MOLT", "target": "Z2", "edge_type": "control_flow", "first_seen": "2026-09-10"}, {"source": "Z2", "target": "MOLT", "edge_type": "control_flow", "first_seen": "2026-09-10"}, {"source": "MOLT", "target": "CONST", "edge_type": "control_flow", "first_seen": "2026-09-10"}, {"source": "MOLT", "target": "ML", "edge_type": "data_flow", "first_seen": "2026-09-10"}, {"source": "CONST", "target": "TC", "edge_type": "data_flow", "first_seen": "2026-09-07"}, {"source": "CONST", "target": "Q", "edge_type": "data_flow", "first_seen": "2026-09-10"}, {"source": "CONST", "target": "PRS", "edge_type": "data_flow", "first_seen": "2026-09-10"}, {"source": "CONST", "target": "AG", "edge_type": "data_flow", "first_seen": "2026-09-10"}, {"source": "ML", "target": "EV", "edge_type": "data_flow", "first_seen": "2026-09-07"}, {"source": "MOLT", "target": "NF", "edge_type": "data_flow", "first_seen": "2026-09-10"}, {"source": "MOLT", "target": "FS", "edge_type": "callout", "first_seen": "2026-09-10"}, {"source": "MOLT", "target": "ADV", "edge_type": "control_flow", "first_seen": "2026-09-10"}, {"source": "REG", "target": "MK", "edge_type": "data_flow", "first_seen": "2026-09-07"}, {"source": "MK", "target": "CIG", "edge_type": "control_flow", "first_seen": "2026-09-10"}, {"source": "MK", "target": "OTS", "edge_type": "data_flow", "first_seen": "2026-09-07"}, {"source": "RU", "target": "RL", "edge_type": "data_flow", "first_seen": "2026-09-13"}, {"source": "RU", "target": "RCEN", "edge_type": "data_flow", "first_seen": "2026-09-13"}, {"source": "RCEN", "target": "RL", "edge_type": "data_flow", "first_seen": "2026-09-13"}, {"source": "RCEN", "target": "Q", "edge_type": "callout", "first_seen": "2026-09-13"}, {"source": "RL", "target": "Q", "edge_type": "data_flow", "first_seen": "2026-09-13"}, {"source": "Q", "target": "RL", "edge_type": "data_flow", "first_seen": "2026-09-13"}, {"source": "Z2", "target": "RL", "edge_type": "data_flow", "first_seen": "2026-09-13"}, {"source": "RL", "target": "MOLT", "edge_type": "data_flow", "first_seen": "2026-09-13"}, {"source": "RCEN", "target": "FS", "edge_type": "callout", "first_seen": "2026-09-13"}], "unresolved": [{"id": "FS", "implementation": "findings_scan.py (skill)"}, {"id": "OM", "implementation": "operator_model_v0_2.py"}, {"id": "TC", "implementation": "tune_check.py"}, {"id": "EV", "implementation": "event logs"}, {"id": "CONST", "implementation": "constants/*.json"}, {"id": "ML", "implementation": "molt_events.jsonl"}, {"id": "MK", "implementation": "registry_merkle_v1.py"}, {"id": "OTS", "implementation": "anchor_root.sh"}]};
const ZCOL = {Z1:"var(--z1)",Z2:"var(--z2)",Z3:"var(--z3)",code:"var(--zc)",CI:"var(--zx)"};
const colFor = z => ZCOL[z] || "var(--zx)";
const NS = "http://www.w3.org/2000/svg";
const W = 800, H = 640, CX = 400, CY = 320, R = 255;
const day = s => Date.parse(s + "T00:00:00Z") / 86400000;
const iso = d => new Date(d * 86400000).toISOString().slice(0, 10);

const nodes = DATA.nodes.slice();
// place nodes on a ring, grouped by zone so zones form arcs
const byZone = {};
nodes.forEach(n => (byZone[n.zone] = byZone[n.zone] || []).push(n));
const order = [].concat(...Object.keys(byZone).sort().map(z => byZone[z]));
order.forEach((n, i) => {
  const a = -Math.PI / 2 + (2 * Math.PI * i) / order.length;
  n.x = CX + R * Math.cos(a); n.y = CY + R * Math.sin(a);
});
const byId = Object.fromEntries(nodes.map(n => [n.id, n]));

const svg = document.getElementById("g");
const el = (tag, attrs, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(e); return e;
};
const edgeEls = DATA.edges.map(e => {
  const s = byId[e.source], t = byId[e.target];
  const line = el("line", {x1: s.x, y1: s.y, x2: t.x, y2: t.y, class: "edge" +
    (e.edge_type === "callout" ? " fb" : ""), opacity: 0});
  return {e, line, s, t};
});
const nodeEls = nodes.map(n => {
  const g = el("g", {class: "node", opacity: 0});
  const c = el("circle", {cx: n.x, cy: n.y, r: 9, fill: colFor(n.zone),
    stroke: n.date_source === "fallback" ? "var(--fg)" : "none", "stroke-dasharray": "2 2"}, g);
  const pulse = el("circle", {cx: n.x, cy: n.y, r: 9, fill: "none",
    stroke: "var(--pulse)", "stroke-width": 2, opacity: 0}, g);
  const lx = n.x + (n.x - CX) * 0.14, ly = n.y + (n.y - CY) * 0.14 + 4;
  const anchor = n.x < CX - 5 ? "end" : n.x > CX + 5 ? "start" : "middle";
  const t = el("text", {x: lx, y: ly, class: "label", "text-anchor": anchor}, g);
  t.textContent = n.id;
  const title = el("title", {}, g);
  title.textContent = `${n.id} ${n.name} | zone ${n.zone} | first ${n.first_seen} | last ${n.last_changed} | commits ${n.commit_count}`;
  return {n, g, pulse};
});

const legend = document.getElementById("legend");
Object.keys(byZone).sort().forEach(z => {
  const s = document.createElement("span");
  const dot = document.createElement("span");
  dot.className = "dot";
  dot.style.background = colFor(z);
  s.appendChild(dot);
  s.appendChild(document.createTextNode(`${z} (${byZone[z].length})`));
  legend.appendChild(s);
});
legend.insertAdjacentHTML("beforeend", `<span><span class="dot" style="border:1px dashed var(--fg)"></span>date from graph file (no git match)</span><span><span class="dot" style="background:none;border:2px solid var(--pulse)"></span>changed in last 7 days</span>`);

const days = DATA.nodes.map(n => day(n.first_seen));
const minD = Math.min(day(DATA.graph_revisions[0] || DATA.nodes[0].first_seen), ...days);
const maxD = Math.max(day(DATA.head_date || iso(Date.now()/86400000)), ...DATA.nodes.map(n => day(n.last_changed)));
const slider = document.getElementById("t");
slider.max = Math.ceil(maxD - minD);
slider.value = slider.max;

document.getElementById("sub").textContent =
  `Built from git history at ${DATA.head}. ${nodes.length} nodes, ${DATA.edges.length} edges. Dates are commit dates. ${DATA.unresolved.length} node(s) fell back to the graph-file date.`;

function render() {
  const t = minD + Number(slider.value);
  document.getElementById("date").textContent = iso(t);
  let vis = 0, act = 0;
  nodeEls.forEach(({n, g, pulse}) => {
    const on = day(n.first_seen) <= t;
    g.setAttribute("opacity", on ? 1 : 0);
    // a commit inside the trailing 7-day window ending at the selected date
    const recent = on && n.commit_dates.some(d => { const x = day(d); return x <= t && t - x <= 7; });
    pulse.setAttribute("opacity", recent ? 1 : 0);
    if (on) vis++; if (recent) act++;
  });
  edgeEls.forEach(({e, line}) => line.setAttribute("opacity", day(e.first_seen) <= t ? 0.7 : 0));
  document.getElementById("stats").textContent =
    `${vis} of ${nodes.length} nodes exist · ${act} changed in last 7 days · ${DATA.graph_revisions.filter(d => day(d) <= t).length} graph-file revisions so far`;
}
slider.addEventListener("input", render);

let timer = null;
document.getElementById("play").addEventListener("click", () => {
  if (timer) { clearInterval(timer); timer = null; document.getElementById("play").textContent = "Play"; return; }
  if (Number(slider.value) >= slider.max) slider.value = 0;
  document.getElementById("play").textContent = "Pause";
  timer = setInterval(() => {
    slider.value = Math.min(Number(slider.value) + 1, slider.max);
    render();
    if (Number(slider.value) >= slider.max) { clearInterval(timer); timer = null; document.getElementById("play").textContent = "Play"; }
  }, 120);
});
render();
</script></body></html>
