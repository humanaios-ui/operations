name: agent-api-monitor

# Ran daily at 09:00 UTC until the pause below.
on:
  # Schedule paused by Q-AGENT-WORKFLOWS-01 W2 (2026-11-26): Supabase legacy API keys were disabled 2026-09-10.
  # Re-enable the daily cron when SUPABASE_KEY is rotated to a current key, and METACULUS_TOKEN and
  # SLACK_WEBHOOK_URL are set (on 2026-11-25 the Metaculus check got HTTP 403 and no alert was sent).
  # A green run does not prove Metaculus is healthy: the script exits 0 even when a check fails.
  # Manual runs still work.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor-apis:
    name: Check API health (daily)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install requests anthropic supabase

      - name: Run API Monitoring Bot
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          python3 tools/agents/api_monitoring_bot_v1.py --check-all

      - name: Upload results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-monitor-results-${{ github.run_id }}
          path: /tmp/api-monitor-*
          retention-days: 30
