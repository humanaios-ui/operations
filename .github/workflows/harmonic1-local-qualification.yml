name: HARMONIC-1 local inference qualification (hermetic)
on:
  pull_request:
    paths:
      - 'services/haios_mcp/src/haios_mcp/harmonic1.py'
      - 'services/haios_mcp/src/haios_mcp/resource_provenance.py'
      - 'services/haios_mcp/tests/test_resource_provenance.py'
      - 'services/haios_mcp/scripts/resource_provenance_replay.py'
      - 'services/haios_mcp/fixtures/mac_neo_funding_pilot.json'
      - 'services/haios_mcp/RESOURCE_PROVENANCE_E0.md'
      - 'services/haios_mcp/tests/test_harmonic1.py'
      - 'services/haios_mcp/scripts/harmonic1_qualify.py'
      - 'services/haios_mcp/HARMONIC1.md'
      - '.github/workflows/harmonic1-local-qualification.yml'
concurrency:
  group: harmonic1-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  hermetic-local-model-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run bounded local HTTP, privacy and comparison tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=services/haios_mcp/src python -m unittest -v services/haios_mcp/tests/test_harmonic1.py
          PYTHONPATH=services/haios_mcp/src python -m unittest -v services/haios_mcp/tests/test_resource_provenance.py
          PYTHONPATH=services/haios_mcp/src python services/haios_mcp/scripts/resource_provenance_replay.py | python -c 'import sys,json; p=json.load(sys.stdin); assert p["provenance_status"]=="NOT_VERIFIED" and p["P1_claim_check"]=="UNSUPPORTED_MODEL_ASSERTION" and p["P3_claim_check"]=="INTERNAL_CONTRADICTION" and p["receipts_created"]==0, p'
          PYTHONPATH=services/haios_mcp/src python services/haios_mcp/scripts/harmonic1_qualify.py --mode synthetic
