name: Resource Miner Scan

# temporal_class: OBSERVATIONAL — the daily clock samples public funding/opportunity
# sources into a snapshot file. A tick grants no internal priority, authority, or
# obligation to act; it is not a deadline, review cadence, or governance control.
on:
  schedule:
    # Daily at 06:15 UTC — offset from weekly-profile-sync (09:00 Mon) and
    # weekly-funding-rescore (09:30 Mon) so these jobs don't land on the same
    # runner minute.
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run resource-miner regression tests
        working-directory: humanaios-funding-pipeline/resource-miner
        run: python3 -m unittest discover -s tests -v

      - name: Resolve persistent Resource Mines
        working-directory: humanaios-funding-pipeline/resource-miner
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HACKERONE_API_USERNAME: ${{ secrets.HACKERONE_API_USERNAME }}
          HACKERONE_API_TOKEN: ${{ secrets.HACKERONE_API_TOKEN }}
        run: |
          python3 -m resource_miner.cli resolve-mines \
            --out data/opportunities.snapshot.jsonl \
            --receipts-out data/mine-resolution.snapshot.jsonl

      - name: Scan for resource candidates
        working-directory: humanaios-funding-pipeline/resource-miner
        run: |
          python3 -m resource_miner.cli scan --out data/resources.snapshot.jsonl

      - name: Commit updated resource snapshot
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "HumanAIOS Bot"

          SNAPSHOTS=(
            humanaios-funding-pipeline/resource-miner/data/resources.snapshot.jsonl
            humanaios-funding-pipeline/resource-miner/data/opportunities.snapshot.jsonl
            humanaios-funding-pipeline/resource-miner/data/mine-resolution.snapshot.jsonl
          )

          if git diff --quiet -- "${SNAPSHOTS[@]}" && \
             git ls-files --error-unmatch "${SNAPSHOTS[1]}" "${SNAPSHOTS[2]}" >/dev/null 2>&1; then
            echo "No Resource Miner snapshot changes, skipping commit"
          else
            git add "${SNAPSHOTS[@]}"
            git commit -m "chore: auto-refresh resource-mine snapshots ($(date -u +'%Y-%m-%d'))"
            git push
          fi
