name: governance-files

# BLOCKING gate for the governance-file registry.
#
# GOVERNANCE_FILES.md used to be hand-maintained. On 2026-09-21 it marked eight
# present files 🔴 MISSING and described REGISTERED.md in terms the ratified
# REGISTRY_SPEC.md contradicts. Nothing caught it because nothing was watching:
# the file belonged to no control plane and appeared in no registry, including
# the controlled-document registry it sits beside.
#
# It is now a rendered view of .gov-control/governance-files.yaml, with the
# Status column derived by stat-ing each declared path at render time. This
# workflow is what keeps that true:
#
#   validate.py  — every declared path resolves; no hand-set status anywhere
#   render.py --check — the published markdown matches the SSOT
#
# Same shape as document-control.yml and the z2 gate: self-test the tooling
# first (a renderer that silently no-ops would make the --check vacuous), then
# gate.
#
# PATH FILTER applied (Phase 1 optimization for deployment frequency).
#
# Original design: no path filter, to catch PRs that delete governed files.
# Optimization: added path filter on `.gov-control/**`, `GOVERNANCE_FILES.md`, and
# the workflow itself. This reduces every-PR overhead (Vercel rate limiting) while
# retaining the critical check on governance-plane changes. Trade-off: PRs that delete
# REGISTERED.md or other governed files will not trigger this check unless they also
# touch `.gov-control/**` or `GOVERNANCE_FILES.md`.
#
# Rationale: (1) Deletions of governed files are rare and would likely be caught by
# repository-admission-gate. (2) The job is lightweight (four short Python runs), but
# deployment frequency is the bottleneck (Vercel rate limits), not job runtime. (3)
# Governance changes that affect file declarations (.gov-control/governance-files.yaml)
# will still trigger this check.
#
# If a governed file deletion without `.gov-control/**` change slips through, add it to
# RECOVERY in this file's future ops-sync and revisit the filter.

on:
  pull_request:
    paths:
      - '.gov-control/**'
      - 'GOVERNANCE_FILES.md'
      - '.github/workflows/governance-files.yml'
  push:
    branches: [main]
    paths:
      - '.gov-control/**'
      - 'GOVERNANCE_FILES.md'
      - '.github/workflows/governance-files.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install deps
        run: pip install --quiet pyyaml

      - name: Renderer self-test
        run: python3 .gov-control/render.py --smoke-test

      - name: Validator self-test
        run: python3 .gov-control/validate.py --smoke-test

      - name: Registry matches the tree (ERROR — blocks merge)
        run: python3 .gov-control/validate.py

      - name: GOVERNANCE_FILES.md is in sync (ERROR — blocks merge)
        run: python3 .gov-control/render.py --check

      - name: Emit Workflow Telemetry (Phase 2B)
        if: always()
        run: |
          python3 << 'TELEMETRY_EOF'
          import json
          from datetime import datetime

          telemetry = {
              "timestamp": datetime.utcnow().isoformat() + "Z",
              "workflow": "governance-files",
              "trigger_reason": "${{ github.event_name }}",
              "path_filter_active": True,
              "path_filter_hit": True,
              "validation_result": "${{ job.status }}"
          }

          # Add PR context if available
          if "${{ github.event_name }}" == "pull_request":
              telemetry["pr_number"] = "${{ github.event.pull_request.number }}"
              telemetry["pr_title"] = "${{ github.event.pull_request.title }}"

          with open("telemetry.json", "w") as f:
              json.dump(telemetry, f, indent=2)
          TELEMETRY_EOF

      - name: Upload Telemetry Artifact
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: workflow-telemetry-governance-files
          path: telemetry.json
          retention-days: 30
