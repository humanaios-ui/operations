name: governance-files

# BLOCKING gate for the governance-file registry.
#
# GOVERNANCE_FILES.md used to be hand-maintained. On 2026-09-21 it marked eight
# present files 🔴 MISSING and described REGISTERED.md in terms the ratified
# REGISTRY_SPEC.md contradicts. Nothing caught it because nothing was watching:
# the file belonged to no control plane and appeared in no registry, including
# the controlled-document registry it sits beside.
#
# It is now a rendered view of .gov-control/governance-files.yaml, with the
# Status column derived by stat-ing each declared path at render time. This
# workflow is what keeps that true:
#
#   validate.py  — every declared path resolves; no hand-set status anywhere
#   render.py --check — the published markdown matches the SSOT
#
# Same shape as document-control.yml and the z2 gate: self-test the tooling
# first (a renderer that silently no-ops would make the --check vacuous), then
# gate.
#
# NO PATH FILTER, deliberately.
#
# `validate.py` reads every path the SSOT declares and `render.py` derives the
# Status column from the tree, so this gate's verdict depends on the whole
# repository, not on the control-plane files. A filter listing only
# `.gov-control/**` and `GOVERNANCE_FILES.md` would let a PR that adds or
# deletes a declared file — `REGISTERED.md`, `PRIORITY_QUEUE.md`, any of them —
# skip the gate entirely and leave the rendered status asserting PRESENT for a
# file that is gone. That is the same IC-041 shape this PR is fixing elsewhere,
# and an exhaustive filter would itself be a hand-maintained mirror of the
# SSOT's path list: the exact defect the control plane exists to remove.
#
# The job is four short Python runs with no network, so running it on every PR
# costs less than maintaining a list that can drift.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install deps
        run: pip install --quiet pyyaml

      - name: Renderer self-test
        run: python3 .gov-control/render.py --smoke-test

      - name: Validator self-test
        run: python3 .gov-control/validate.py --smoke-test

      - name: Registry matches the tree (ERROR — blocks merge)
        run: python3 .gov-control/validate.py

      - name: GOVERNANCE_FILES.md is in sync (ERROR — blocks merge)
        run: python3 .gov-control/render.py --check
