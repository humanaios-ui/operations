name: Oracle Replay Regression
on:
  pull_request:
    paths:
      - 'oracles/engine/forecast_replay_v0_1.py'
      - 'oracles/schemas/oracle_forecast_manifest_v0_1.schema.json'
      - 'ledgers/CI_PREDICT_LEDGER.jsonl'
      - 'tests/test_oracle_forecast_replay_v0_1.py'
      - '.github/workflows/oracle-replay-regression.yml'
  workflow_dispatch:
concurrency:
  group: oracle-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install required verifier dependencies
        run: python -m pip install pytest 'jsonschema[format]'
      - name: Oracle bounded replay + adversarial regression
        run: python -m pytest -q tests/test_oracle_forecast_replay_v0_1.py
