name: research-graph-view

# Phase 1 of the research-graph living view (issue #874, hub #799).
# Read-only. Runs default-branch code only, never pull_request_target, never
# checks out PR head code. Writes research-graph/ in the runner workspace and
# uploads it as an artifact. Commits nothing and posts nothing.
# Manual dispatch only: a schedule would be a temporal control, which
# temporal-dissolution-gate rejects without a policy classification.
on:
  workflow_dispatch:

permissions: {}

jobs:
  view:
    name: Research graph view (read-only, NO ADMISSION AUTHORITY)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    steps:
      - name: Checkout default-branch control law
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Generate read-only view
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 tools/research_graph_view.py --out-dir research-graph

      - name: Upload generated view
        uses: actions/upload-artifact@v4
        with:
          name: research-graph-view-${{ github.run_id }}
          path: research-graph/
          if-no-files-found: error
          retention-days: 30
