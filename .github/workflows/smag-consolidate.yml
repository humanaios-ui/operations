# smag-consolidate — the CONSOLIDATE + ANALYZE half of the recursive-learning loop.
#
# CAPTURE (smag-capture.yml) posts one predicted-vs-measured row per merged PR as a
# comment on the SMAG pilot ledger issue (#103). This job periodically drains those
# comment rows into the durable ledger (audits/smag_pilot_ledger.jsonl), recomputes
# the predicted-vs-measured gap report, and opens a PR with the deltas — closing the
# loop that previously captured but never consolidated.
#
# Read-only against GitHub except the ledger/report files it proposes via PR.
# No credentials handled — uses the standard GITHUB_TOKEN.
name: smag-consolidate

on:
  schedule:
    - cron: "17 6 * * 1"   # weekly, Mondays 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: read

env:
  # MUST match the value in .github/workflows/molt-tier-check.yml. 0 is the
  # sentinel for "the tracking issue does not exist yet": that workflow refuses
  # to post on it and this one skips the drain, so the two never disagree about
  # whether the series is live.
  MOLT_TIER_TRACKING_ISSUE: "0"

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Consolidate #103 SMAG rows into the ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/smag_consolidate_v1_0.py \
            --repo "${{ github.repository }}" --issue 103 \
            --ledger audits/smag_pilot_ledger.jsonl

      # The molt-tier gap series, drained by the SAME tool into its OWN ledger.
      # A separate issue and a separate file because smag_consolidate_v1_0.py
      # dedups on `pr` and keeps the first row per PR — merged into #103 the two
      # series would shadow each other one row at a time.
      #
      # This is what gives MOLT_STATE.md's under-claim falsifier something to
      # read: "(measured - claimed > 1) / total PRs over a rolling 30-day
      # window, target < 5%". No new tooling; the consolidator was already
      # parameterised on --issue and --ledger.
      #
      # MOLT_TIER_TRACKING_ISSUE is 0 in .github/workflows/molt-tier-check.yml
      # until the tracking issue is created. Set BOTH to the real number in the
      # same change, or this step drains nothing while that one refuses to post.
      - name: Consolidate molt-tier gap rows into their ledger
        if: env.MOLT_TIER_TRACKING_ISSUE != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/smag_consolidate_v1_0.py \
            --repo "${{ github.repository }}" --issue "${MOLT_TIER_TRACKING_ISSUE}" \
            --ledger audits/molt_tier_gap_ledger.jsonl

      - name: Resolve capture timing (record CI outcome after checks finish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Rows captured at merge-close may hold in_progress checks; re-query each
          # row's terminal state so `measured` reflects resolved pass/fail before we
          # analyze. Pending rows self-heal on the next run.
          python3 tools/smag_resolve_v1_0.py \
            --repo "${{ github.repository }}" \
            --ledger audits/smag_pilot_ledger.jsonl

      - name: Recompute the predicted-vs-measured gap report
        run: |
          python3 tools/smag_gap_analysis_v1_0.py \
            --ledger audits/smag_pilot_ledger.jsonl \
            --out audits/smag_gap_report.md

      - name: FEED BACK — gap cues into the lessons ledger
        run: |
          python3 tools/smag_feedback_v1_0.py \
            --ledger audits/smag_pilot_ledger.jsonl \
            --lessons data/lessons_learned_ledger.json

      - name: META FEED BACK — measure SMAG's own consolidation accuracy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Wire SMAG's self-accuracy signal: how well did SMAG predict its own PRs?
          # This closes the loop on SMAG's own learning.
          python3 tools/smag_meta_feedback_v1_0.py \
            --repo "${{ github.repository }}" \
            --consolidation-pr-prefix "SMAG: consolidate" \
            --lessons data/lessons_learned_ledger.json \
            --lookback-days 30
        continue-on-error: true
        # Continue if API throttle or GH_TOKEN issues; meta-feedback is advisory

      - name: Wire SMAG rows to empirica CLI with LLM analysis + predictions
        run: |
          # Generate ACAT-classified gaps + remediation suggestions + next-cycle predictions
          # This increases learning_density by linking gaps → remediations → predictions
          # Includes T3.2 (gap classification) + T3.3 (prediction model)
          python3 tools/smag_gap_analyzer.py \
            --ledger audits/smag_pilot_ledger.jsonl \
            --output empirica | empirica log-artifacts -
        continue-on-error: true
        # Continue even if empirica CLI isn't available in this environment
        # (CI may not have empirica tooling; trajectory generation is best-effort)

      - name: Generate SMAG predictions report
        run: |
          # Extract and format predictions for review
          python3 tools/smag_gap_analyzer.py \
            --ledger audits/smag_pilot_ledger.jsonl \
            --output json > audits/smag_predictions.json
          echo "Gap rate: $(jq -r '.summary.metrics.gap_rate | . * 100 | floor' audits/smag_predictions.json)%"
          echo "Focus areas: $(jq -r '.summary.focus_areas[]' audits/smag_predictions.json | sed 's/^/  - /')"
        continue-on-error: true

      - name: Open a PR if the ledger or report changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- audits/smag_pilot_ledger.jsonl audits/smag_gap_report.md \
               data/lessons_learned_ledger.json audits/molt_tier_gap_ledger.jsonl; then
            echo "No new SMAG rows — nothing to consolidate."
            exit 0
          fi
          branch="smag-consolidate/$(date -u +%Y%m%d-%H%M%S)"
          git config user.name  "smag-consolidate[bot]"
          git config user.email "smag-consolidate@users.noreply.github.com"
          git checkout -b "$branch"
          git add audits/smag_pilot_ledger.jsonl audits/smag_gap_report.md \
                  data/lessons_learned_ledger.json audits/molt_tier_gap_ledger.jsonl
          git commit -m "chore(smag): consolidate #103 rows + refresh gap report + FEED BACK cues"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "SMAG: consolidate ledger + refresh gap report" \
            --body "Automated CONSOLIDATE+ANALYZE+FEED BACK step of the recursive-learning loop. Drains new predicted-vs-measured rows from #103 into the ledger, refreshes the gap report, and upserts any gap-driver or insufficient-calibration-data cue into data/lessons_learned_ledger.json (tools/smag_feedback_v1_0.py). Promoting a cue to a blocking gate or a REGISTERED finding is a separate, human act — this only records the cue. Review the gap_rate trend before merging.

          ## Prediction (SMAG calibration)

          smag_p: 0.90
          smag_p_meta: 0.85

          Why 0.90 (author-SMAG)? Standard FEED BACK step is mostly mechanical; consolidated ledger and reports have few dependencies.

          Why 0.85 (meta-SMAG self-prediction)? Consolidation is mostly mechanical (ledger dedup, gap report regeneration), but schema changes and edge cases carry risk. CI checks will validate before merge."
