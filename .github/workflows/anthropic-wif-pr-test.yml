name: anthropic-wif-pr-test
on: pull_request
permissions:
  id-token: write
  contents: read
jobs:
  call-claude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            fs.writeFileSync('/tmp/gha-jwt', token);
      - name: Call Claude through WIF
        run: |
          pip install -q anthropic
          cat > wif_check.py <<'PY'
          import anthropic
          from anthropic import WorkloadIdentityCredentials

          def read_token() -> str:
              with open("/tmp/gha-jwt") as f:
                  return f.read().strip()

          client = anthropic.Anthropic(
              credentials=WorkloadIdentityCredentials(
                  identity_token_provider=read_token,
                  federation_rule_id="fdrl_01WB6XhYgqvwM4dqwyE7vduE",
                  organization_id="2045a613-7061-46a1-833a-14cfe50140d3",
                  service_account_id="svac_016xi2kX1vHuzrWyj1hvWHGB",
                  workspace_id="wrkspc_01KkGAuKeuooSK4rZYDyz13R",
              ),
          )

          message = client.messages.create(
              model="claude-sonnet-5-5",
              max_tokens=1024,
              messages=[{"role": "user", "content": "Hello, Claude"}],
          )
          print(message.content[0].text)
          PY
          python3 wif_check.py
