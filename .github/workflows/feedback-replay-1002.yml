name: Resource Miner #1002 Shadow Replay

on:
  pull_request:
    paths:
      - 'humanaios-funding-pipeline/resource-miner/resource_miner/feedback_replay_1002.py'
      - 'humanaios-funding-pipeline/resource-miner/tests/test_feedback_replay_1002.py'
      - 'humanaios-funding-pipeline/resource-miner/fixtures/feedback_replay_1002_v1.json'
      - 'humanaios-funding-pipeline/resource-miner/data/resources.snapshot.jsonl'
      - '.github/workflows/feedback-replay-1002.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-shadow-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fixed #1002 replay tests
        working-directory: humanaios-funding-pipeline/resource-miner
        run: python3 -m unittest tests.test_feedback_replay_1002 -v
      - name: Write reproducible non-authorizing behavioral baseline
        working-directory: humanaios-funding-pipeline/resource-miner
        run: python3 -m resource_miner.feedback_replay_1002 --output ../../outputs/feedback-replay-1002/first-shadow-replay.json
      - name: Preserve replay observation for later training-study design
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feedback-replay-1002-${{ github.sha }}
          path: outputs/feedback-replay-1002/first-shadow-replay.json
          if-no-files-found: warn
          retention-days: 90
