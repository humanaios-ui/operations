name: workflow-path-validation

# CI gate for GitHub Actions workflow path filter validation
#
# Prevents IC-032 class issues where workflow path filters reference
# non-existent files. Uses tools/workflow_path_validator.py to validate
# that all paths in workflow filters actually exist in the repository.
#
# Runs on:
# - Any change to .github/workflows/*.yml files (catches path filter updates)
# - Workflow dispatch for manual validation
#
# Exit codes:
#   0: All paths valid (merge permitted)
#   1: One or more paths not found (merge blocked)
#
# Part of Phase 2B: Tier 1 (Operational) IC-032 Prevention

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tools/workflow_path_validator.py'
      - '.github/workflows/workflow-path-validation.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'tools/workflow_path_validator.py'
      - '.github/workflows/workflow-path-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install deps
        run: pip install --quiet pyyaml

      - name: Validator self-test
        run: python3 -c "import yaml; print('✓ PyYAML installed')"

      - name: Validate all workflow files (ERROR — blocks merge)
        run: python3 tools/workflow_path_validator.py .github/workflows/*.yml

      - name: Emit Workflow Telemetry (Phase 2B)
        if: always()
        run: |
          python3 << 'TELEMETRY_EOF'
          import json
          from datetime import datetime

          telemetry = {
              "timestamp": datetime.utcnow().isoformat() + "Z",
              "workflow": "workflow-path-validation",
              "trigger_reason": "${{ github.event_name }}",
              "validation_target": "workflow_files",
              "validation_result": "${{ job.status }}"
          }

          # Add PR context if available
          if "${{ github.event_name }}" == "pull_request":
              telemetry["pr_number"] = "${{ github.event.pull_request.number }}"
              telemetry["pr_title"] = "${{ github.event.pull_request.title }}"

          with open("telemetry.json", "w") as f:
              json.dump(telemetry, f, indent=2)
          TELEMETRY_EOF

      - name: Upload Telemetry Artifact
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: workflow-telemetry-path-validation
          path: telemetry.json
          retention-days: 30