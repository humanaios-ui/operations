name: coordinator-issue-route

# Process `/coordinator admit` and `/coordinator revoke` commands in PR/issue comments.
# These commands trigger the admission-gate workflow's mutation job to append state events
# to the admission ledger on the repository-coordinator-state branch.
#
# This workflow parses comment bodies, validates the command, and dispatches to the
# mutate job in repository-admission-gate.yml with the appropriate decision and subject.

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  # One dispatch at a time; later commands cancel earlier ones for the same subject.
  group: coordinator-issue-route-${{ github.event.issue.number }}
  cancel-in-progress: true

# Legacy free-form comment dispatcher is intentionally disabled.
# Issue commands are handled by the policy-bound 'issue_mutate' job in
# repository-admission-gate.yml. PR admission requires authenticated
# exact-head approval and must never follow a comment-only dispatch.
jobs:
  route:
    name: Reject legacy comment-only coordinator dispatch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fail closed and direct operators to trusted path
        run: |
          echo "::notice::Legacy comment-only workflow dispatch disabled. Use policy-bound issue_mutate for issues; PR admission requires independent authenticated approval."
