name: security-gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-dependencies:
    name: Python dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python3 -m pip install --quiet pip-audit

      - name: Audit all requirements files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            mapfile -t reqs < <(
              git diff --diff-filter=ACMR --name-only "${BASE_SHA}" "${HEAD_SHA}" \
                | grep -E '(^|/)requirements[^/]*\.txt$' \
                | sort \
                || true
            )
          else
            mapfile -t reqs < <(find . -name "requirements*.txt" | sort)
          fi

          if [ "${#reqs[@]}" -eq 0 ]; then
            echo "No requirements files to audit for ${EVENT_NAME}."
            exit 0
          fi

          printf 'Auditing requirements files:\n%s\n' "${reqs[@]}"
          for req in "${reqs[@]}"; do
            normalized_req="${req#./}"
            echo "Auditing ${req}"
            if [ "${normalized_req}" = "tools/Metaculus/requirements.txt" ]; then
              # Exception, Z2-approved 2026-10-31 (ratifier): tools/Metaculus pins
              # forecasting-tools<0.4.0, which does not allow the filelock and
              # cryptography fixes. Those findings are ignored for this file only.
              # Owner: humanaios-ui. Review when forecasting-tools allows them.
              # The pillow findings are no longer ignored: forecasting-tools 0.3.7
              # allows pillow 13 and requirements.txt now floors it at 0.3.7
              # (issue #1214, Q-PILLOW-PYSEC-2026-4363-WAIVER-01 and
              # Q-PILLOW-TIFF-ADVISORIES-WAIVER-01 exit). The other ignores here
              # were measured as unused on 2026-11-14 and are removed.
              # Comments stay above the command: a comment line inside a
              # backslash-continued command ends it and drops the final argument.
              python3 -m pip_audit \
                --ignore-vuln PYSEC-2026-3552 \
                --ignore-vuln CVE-2026-112940 \
                --ignore-vuln CVE-2026-112913 \
                --ignore-vuln CVE-2026-112907 \
                --ignore-vuln CVE-2026-112938 \
                --ignore-vuln CVE-2026-112936 \
                --ignore-vuln CVE-2026-112910 \
                --ignore-vuln CVE-2026-112909 \
                --ignore-vuln CVE-2026-112911 \
                --ignore-vuln CVE-2026-112939 \
                --ignore-vuln CVE-2026-112915 \
                --ignore-vuln CVE-2026-112935 \
                --ignore-vuln CVE-2026-112912 \
                --ignore-vuln CVE-2026-112908 \
                -r "${req}"
            else
              python3 -m pip_audit -r "${req}"
            fi
          done
