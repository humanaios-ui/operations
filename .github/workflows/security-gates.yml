name: security-gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-dependencies:
    name: Python dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python3 -m pip install --quiet pip-audit

      - name: Audit all requirements files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            mapfile -t reqs < <(
              git diff --diff-filter=ACMR --name-only "${BASE_SHA}" "${HEAD_SHA}" \
                | grep -E '(^|/)requirements[^/]*\.txt$' \
                | sort \
                || true
            )
          else
            mapfile -t reqs < <(find . -name "requirements*.txt" | sort)
          fi

          if [ "${#reqs[@]}" -eq 0 ]; then
            echo "No requirements files to audit for ${EVENT_NAME}."
            exit 0
          fi

          printf 'Auditing requirements files:\n%s\n' "${reqs[@]}"
          for req in "${reqs[@]}"; do
            echo "Auditing ${req}"
            python3 -m pip_audit -r "${req}"
          done
