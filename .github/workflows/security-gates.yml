name: security-gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-dependencies:
    name: Python dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python3 -m pip install --quiet pip-audit

      - name: Audit all requirements files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            mapfile -t reqs < <(
              git diff --diff-filter=ACMR --name-only "${BASE_SHA}" "${HEAD_SHA}" \
                | grep -E '(^|/)requirements[^/]*\.txt$' \
                | sort \
                || true
            )
          else
            mapfile -t reqs < <(find . -name "requirements*.txt" | sort)
          fi

          if [ "${#reqs[@]}" -eq 0 ]; then
            echo "No requirements files to audit for ${EVENT_NAME}."
            exit 0
          fi

          printf 'Auditing requirements files:\n%s\n' "${reqs[@]}"
          for req in "${reqs[@]}"; do
            normalized_req="${req#./}"
            echo "Auditing ${req}"
            if [ "${normalized_req}" = "tools/Metaculus/requirements.txt" ]; then
              python3 -m pip_audit \
                --ignore-vuln PYSEC-2026-36 \
                --ignore-vuln PYSEC-2026-3552 \
                --ignore-vuln PYSEC-2026-3553 \
                --ignore-vuln PYSEC-2026-3554 \
                --ignore-vuln GHSA-537c-gmf6-5ccf \
                # Exception, Z2-approved 2026-10-31 (ratifier): tools/Metaculus pins
                # forecasting-tools<0.4.0, which requires pillow<13 and does not allow
                # filelock fixes. The fixed pillow 13.0.0 cannot resolve with the bot's
                # current dependency, so these CVEs are ignored for this file only.
                # Owner: humanaios-ui. Review by 2026-12-31 or when forecasting-tools
                # releases a pillow-13-compatible version, whichever is first.
                --ignore-vuln PYSEC-2026-4327 \
                --ignore-vuln PYSEC-2026-4328 \
                --ignore-vuln PYSEC-2026-4326 \
                --ignore-vuln PYSEC-2026-4339 \
                --ignore-vuln PYSEC-2026-4340 \
                --ignore-vuln PYSEC-2026-4343 \
                --ignore-vuln PYSEC-2026-4334 \
                --ignore-vuln PYSEC-2026-4337 \
                --ignore-vuln PYSEC-2026-4341 \
                --ignore-vuln PYSEC-2026-4330 \
                --ignore-vuln PYSEC-2026-4338 \
                --ignore-vuln PYSEC-2026-4335 \
                --ignore-vuln PYSEC-2026-4336 \
                --ignore-vuln PYSEC-2026-4331 \
                --ignore-vuln PYSEC-2026-4332 \
                --ignore-vuln PYSEC-2026-4329 \
                --ignore-vuln PYSEC-2026-4333 \
                --ignore-vuln PYSEC-2026-4342 \
                --ignore-vuln CVE-2026-112895 \
                --ignore-vuln CVE-2026-112400 \
                --ignore-vuln CVE-2026-112897 \
                --ignore-vuln CVE-2026-112395 \
                --ignore-vuln CVE-2026-112404 \
                --ignore-vuln CVE-2026-112899 \
                --ignore-vuln CVE-2026-112900 \
                --ignore-vuln CVE-2026-112893 \
                --ignore-vuln CVE-2026-112891 \
                --ignore-vuln CVE-2026-112390 \
                --ignore-vuln CVE-2026-112401 \
                --ignore-vuln CVE-2026-112391 \
                --ignore-vuln CVE-2026-112894 \
                --ignore-vuln CVE-2026-112406 \
                --ignore-vuln CVE-2026-112399 \
                --ignore-vuln CVE-2026-112892 \
                --ignore-vuln CVE-2026-112393 \
                --ignore-vuln CVE-2026-96638 \
                --ignore-vuln CVE-2026-96640 \
                --ignore-vuln CVE-2026-96778 \
                --ignore-vuln GHSA-78g4-xqwv-q3g8 \
                --ignore-vuln CVE-2026-112940 \
                --ignore-vuln CVE-2026-112913 \
                --ignore-vuln CVE-2026-112907 \
                --ignore-vuln CVE-2026-112938 \
                --ignore-vuln CVE-2026-112936 \
                --ignore-vuln CVE-2026-112910 \
                --ignore-vuln CVE-2026-112909 \
                --ignore-vuln CVE-2026-112911 \
                --ignore-vuln CVE-2026-112939 \
                --ignore-vuln CVE-2026-112915 \
                --ignore-vuln CVE-2026-112935 \
                --ignore-vuln CVE-2026-112912 \
                --ignore-vuln CVE-2026-112908 \
                -r "${req}"
            else
              python3 -m pip_audit -r "${req}"
            fi
          done
