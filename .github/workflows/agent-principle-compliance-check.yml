name: agent-principle-compliance-check

# Run on every commit to tools/ (principle compliance is pervasive)
on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/agent-principle-compliance-check.yml"
  pull_request:
    paths:
      - "tools/**"

permissions:
  contents: read
  issues: write

jobs:
  compliance-check:
    name: Check principles (P19)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install requests supabase

      - name: Run Principle Compliance Bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Q-P19-GATE-INERT-01. `git diff --name-only` emits one path per LINE.
          # This was passed to a bot that split on commas, so every multi-file
          # change arrived as a single unsplittable blob and no file was ever
          # opened — the gate reported green having inspected nothing. The bot
          # now accepts either separator; the list is comma-joined here so the
          # contract between the two is explicit rather than incidental.
          BASE="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"

          COMMIT_MSG=$(git log --format=%B -n 1)
          CHANGED_FILES=$(git diff --name-only "$BASE"...HEAD | paste -sd, -)

          echo "Base:  $BASE"
          echo "Files: $CHANGED_FILES"

          python3 tools/agents/principle_compliance_bot_v1.py \
            --check-commit "$COMMIT_MSG" \
            --base "$BASE" \
            --files "$CHANGED_FILES" || EXIT_CODE=$?

          exit ${EXIT_CODE:-0}
