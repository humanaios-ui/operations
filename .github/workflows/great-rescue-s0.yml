name: The Great Rescue S0 contract tests
on:
  pull_request:
    paths:
      - 'experiments/the-great-rescue/**'
      - '.github/workflows/great-rescue-s0.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deterministic physics and two-client room protocol
        run: |
          cd experiments/the-great-rescue
          npm test
          node --check engine.mjs
          node --check server.mjs
          node --check public/app.mjs
