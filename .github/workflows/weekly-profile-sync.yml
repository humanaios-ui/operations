name: Weekly Profile Sync

on:
  # Retired from the schedule by Q-AGENT-WORKFLOWS-01 W3 (2026-11-26): fails since 2026-10-19 (it pushes straight to protected main, which is refused).
  # Manual runs still work. Restore the cron only with a fix that passes a manual run.
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch ORCID profile and extract research areas
        env:
          PYTHONPATH: ./src
        run: |
          python -m humanaios_operations.cli profile sync --verbose

      - name: Commit profile updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "HumanAIOS Bot"

          # Check if there are changes to commit
          if git diff --quiet data/research_profile.json data/expertise_map.json; then
            echo "No changes to profile, skipping commit"
          else
            git add data/research_profile.json data/expertise_map.json
            git commit -m "chore: auto-update research profile from ORCID ($(date -u +'%Y-%m-%d'))"
            git push
          fi
