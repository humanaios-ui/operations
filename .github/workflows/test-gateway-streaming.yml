name: test-gateway-streaming

# Test streaming text generation through AI Gateway
# Demonstrates cost control and gateway routing for AI operations
on:
  workflow_dispatch:
  schedule:
    # Weekly test (Sundays at 12:00 UTC)
    - cron: "0 12 * * 0"

permissions:
  contents: read

jobs:
  stream-test:
    name: Stream text via AI Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install openai

      - name: Test streaming text generation
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          set -euo pipefail
          python3 stream_gateway_text.py

      - name: Report success
        if: success()
        run: |
          echo "✓ Streaming through AI Gateway verified"
          echo "  Model: openai/gpt-6-astra"
          echo "  Endpoint: https://ai-gateway.vercel.sh/v1"
          echo "  Cost control: $5/month cap via Vercel AI Gateway"
