name: HumanAIOS Standing Audit

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: A1 — Stale dimension count
        run: |
          echo "Checking for stale 6-dimension references..."
          if grep -rl "six.dimension\|6.dimension\|6-dimension" --include="*.html" public/ 2>/dev/null; then
            echo "::warning title=A1 AUDIT::Stale dimension count found — instrument is 11 dimensions"
          else
            echo "✅ A1 PASS — no stale dimension references"
          fi

      - name: A4 — Secrets scan
        run: |
          echo "Scanning for credential patterns..."
          if grep -rEl "rah_[a-zA-Z0-9]{20,}|sk-ant[A-Za-z0-9_-]{20,}|ghp_[a-zA-Z0-9]{36,}|cfut_[a-zA-Z0-9]{30,}" \
            --include="*.html" --include="*.js" --include="*.json" \
            --include="*.yml" --include="*.md" \
            --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.github \
            --exclude-dir=workflows --exclude=satellite-haios-audit.yml . 2>/dev/null; then
            echo "::error title=A4 AUDIT::Potential credential exposure found"
            exit 1
          else
            echo "✅ A4 PASS — no credential patterns found"
          fi

      - name: A5 — Security closed items check
        run: |
          echo "Verifying SECURITY_CLOSED.md exists..."
          if [ -f "audit/SECURITY_CLOSED.md" ]; then
            echo "✅ A5 PASS — SECURITY_CLOSED.md present"
          else
            echo "::warning title=A5 AUDIT::audit/SECURITY_CLOSED.md missing — failsafe not in place"
          fi

      - name: A6 — Cherokee check (Principle 12)
        run: |
          echo "Checking for Cherokee references on public surfaces..."
          if grep -rl "Cherokee\|cherokee" --include="*.html" --include="*.md" public/ 2>/dev/null; then
            echo "::warning title=A6 AUDIT::Cherokee reference found on public surface — Principle 12 violation"
          else
            echo "✅ A6 PASS — no Cherokee references on public surfaces"
          fi

      - name: A8 — Framework Mapping reference (operations repo)
        run: |
          echo "Verifying FRAMEWORK_MAPPING.md reference in operations/CLAUDE.md..."
          # Check for Framework Reference section (not historical Appended Events)
          if grep -q "^## Framework Reference" CLAUDE.md 2>/dev/null && \
             grep -A 2 "^## Framework Reference" CLAUDE.md | grep -q "FRAMEWORK_MAPPING.md"; then
            echo "✅ A8 PASS — FRAMEWORK_MAPPING.md properly referenced in Framework Reference section"
          else
            echo "::error title=A8 AUDIT::FRAMEWORK_MAPPING.md reference missing in Framework Reference section of CLAUDE.md"
            exit 1
          fi

      - name: A9 — Framework compliance aggregation (per-repo audit structure)
        run: |
          echo "Preparing framework compliance reporting structure..."
          mkdir -p audit/framework-compliance
          AUDIT_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # Create manifest with actual A8 check result
          cat > audit/framework-compliance/compliance-manifest.json << EOF
          {
            "schema_version": "1.0",
            "audit_date": "$AUDIT_DATE",
            "phase": "1",
            "deadline": "2026-09-17T22:27:07Z",
            "compliance_status": {
              "operations": {
                "framework_reference_present": true,
                "framework_file_accessible": true,
                "a8_check_passed": true,
                "per_repo_audit_trigger_deployed": false,
                "per_repo_results_aggregated": false
              }
            },
            "notes": "Phase 1: operations repo A8 check enforcing. Per-repo audit triggers pending deployment by 2026-09-17T22:27Z."
          }
          EOF
          echo "✅ A9 PASS — compliance manifest created with audit results"

      - name: Audit summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "HumanAIOS Audit Complete"
          echo "Date: $(date -u)"
          echo "Repo: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
