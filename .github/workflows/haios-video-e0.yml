name: haios-video-e0
on:
  pull_request:
    paths:
      - 'experiments/haios_video_e0/**'
      - '.github/workflows/haios-video-e0.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replay offline E0 and compare to committed receipt
        shell: bash
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          cd experiments/haios_video_e0
          node replay.mjs > /tmp/replay-output.json
          diff -u observed.json /tmp/replay-output.json
          echo "observed.json matches replay at HEAD"
          if [ -f episode-01/verify_manifest.mjs ]; then node episode-01/verify_manifest.mjs; fi
