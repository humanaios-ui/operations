name: Wardens Council Prototype Tests

on:
  pull_request:
    paths:
      - 'experiments/wardens-commons/**'
      - '.github/workflows/wardens-council-prototype.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/wardens-commons/**'
      - '.github/workflows/wardens-council-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-council-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check 'fastapi>=0.110,<1' 'uvicorn>=0.30,<1' 'pytest>=8,<10' 'httpx>=0.27,<1'
      - name: Run bounded Council tests
        working-directory: experiments/wardens-commons
        run: python -m pytest -q
      - name: Verify browser widget syntax
        run: node --check experiments/wardens-commons/council-widget.js
