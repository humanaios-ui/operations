# CI calibration: one bounded, single-writer rollup, not a PR per observation.
# PIN and RESOLVE stay independently observed. The consolidation workflow
# runs ONLY trusted main code, never the proposed ledger branch's code.
# An unresolved legacy backlog or diverging hash chain BLOCKS publication.
# This is data review only: no admission, approval, or merge is granted.
name: ci-predict-consolidate

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "Optional single source PR; otherwise sweep latest 50"
        required: false

concurrency:
  group: ci-predict-consolidate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  consolidate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
      pull-requests: write
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Fail closed if trusted tools are absent
        run: |
          set -euo pipefail
          test -f tools/ci_predict_consolidate_v1_0.py
          test -f tools/ci_predict_rollup_v0_1.py
          test -f tools/nf_ledger_v0_1.py
          test -f ledgers/CI_PREDICT_LEDGER.jsonl

      - name: Choose single writer and validate pending chain
        id: writer
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          LEDGER="ledgers/CI_PREDICT_LEDGER.jsonl"
          BRANCH="ci-predict-consolidate/rolling"
          cp "$LEDGER" /tmp/ci-predict-main-ledger.jsonl
          python3 tools/nf_ledger_v0_1.py verify /tmp/ci-predict-main-ledger.jsonl
          gh pr list --repo "$REPO" --state open --limit 200 \
            --json number,title,headRefName > /tmp/ci-predict-open-prs.json
          python3 tools/ci_predict_rollup_v0_1.py select \
            --inventory /tmp/ci-predict-open-prs.json > /tmp/ci-predict-selection.json
          PR_NUMBER="$(python3 -c 'import json; s=json.load(open("/tmp/ci-predict-selection.json")); print((s.get("pr") or {}).get("number") or "")')"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          if [ -n "$PR_NUMBER" ]; then
            git fetch --no-tags origin "$BRANCH"
            EXPECTED_HEAD="$(git rev-parse FETCH_HEAD)"
            echo "expected_head=$EXPECTED_HEAD" >> "$GITHUB_OUTPUT"
            git show "FETCH_HEAD:$LEDGER" > /tmp/ci-predict-rolling-ledger.jsonl
            python3 tools/ci_predict_rollup_v0_1.py verify-prefix \
              --base /tmp/ci-predict-main-ledger.jsonl \
              --candidate /tmp/ci-predict-rolling-ledger.jsonl
            cp /tmp/ci-predict-rolling-ledger.jsonl "$LEDGER"
          else
            # Branch cleanup is an explicit operator action after a merge.
            # Refusal distinguishes a genuinely absent branch (exit 2)
            # from a network/API failure (other nonzero exit).
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
              echo "::error::Merged rolling branch still exists; delete only after verifying the merge." >&2
              exit 1
            else
              rc=$?
              if [ "$rc" -ne 2 ]; then
                echo "::error::Cannot establish rolling branch absence (git ls-remote exit $rc)." >&2
                exit 1
              fi
            fi
          fi
          cp "$LEDGER" /tmp/ci-predict-seed-ledger.jsonl

      - name: Consolidate authenticated checks with strict failure handling
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DISPATCH_PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json
          import os
          import subprocess
          import sys

          repo = os.environ["REPO"]
          dispatch_pr = os.environ.get("DISPATCH_PR", "").strip()
          if dispatch_pr:
              if not dispatch_pr.isascii() or not dispatch_pr.isdecimal() or int(dispatch_pr) < 1:
                  raise SystemExit("invalid dispatch PR number")
              pr_numbers = [dispatch_pr]
          else:
              proc = subprocess.run(
                  ["gh", "pr", "list", "--repo", repo, "--state", "all",
                   "--limit", "50", "--json", "number,title,headRefName",
                   "--search", "sort:updated-desc"],
                  capture_output=True, text=True, check=False,
              )
              if proc.returncode:
                  raise SystemExit("PR inventory failed: " + proc.stderr)
              try:
                  discovered = json.loads(proc.stdout)
              except (ValueError, TypeError) as exc:
                  raise SystemExit("malformed PR inventory") from exc
              pr_numbers = [
                  str(item["number"])
                  for item in discovered
                  if item.get("title") != "ci-predict: consolidate resolved CI predictions"
                  and not str(item.get("headRefName") or "").startswith("ci-predict-consolidate/")
              ]

          failures = []
          for pr in pr_numbers:
              result = subprocess.run(
                  ["python3", "tools/ci_predict_consolidate_v1_0.py", "consolidate",
                   "--repo", repo, "--pr", pr,
                   "--ledger", "ledgers/CI_PREDICT_LEDGER.jsonl"],
                  text=True, capture_output=True, check=False,
              )
              if result.stdout:
                  print(result.stdout)
              if result.returncode:
                  failures.append(pr)
                  print(result.stderr, file=sys.stderr)
          if failures:
              raise SystemExit("consolidation failed; refusing to publish partial ledger: "
                               + ",".join(failures))
          PYEOF

      - name: Verify append-only change and update exactly one review PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.writer.outputs.branch }}
          ROLLING_PR: ${{ steps.writer.outputs.pr }}
          EXPECTED_ROLLING_HEAD: ${{ steps.writer.outputs.expected_head }}
        run: |
          set -euo pipefail
          LEDGER="ledgers/CI_PREDICT_LEDGER.jsonl"
          if cmp -s /tmp/ci-predict-seed-ledger.jsonl "$LEDGER"; then
            echo "No newly verified outcomes — no commit and no PR."
            exit 0
          fi
          python3 tools/nf_ledger_v0_1.py verify "$LEDGER"
          python3 tools/ci_predict_rollup_v0_1.py verify-prefix \
            --base /tmp/ci-predict-seed-ledger.jsonl --candidate "$LEDGER"
          cp "$LEDGER" /tmp/ci-predict-proposed-ledger.jsonl
          git fetch --no-tags origin main
          git show "FETCH_HEAD:$LEDGER" > /tmp/ci-predict-live-main.jsonl
          if ! cmp -s /tmp/ci-predict-main-ledger.jsonl /tmp/ci-predict-live-main.jsonl; then
            echo "::error::Main ledger advanced; recompute on a fresh checkout." >&2
            exit 1
          fi

          if [ -n "$ROLLING_PR" ]; then
            git fetch --no-tags origin "$BRANCH"
            if [ "$(git rev-parse FETCH_HEAD)" != "$EXPECTED_ROLLING_HEAD" ]; then
              echo "::error::Rolling branch advanced; retry without rewriting history." >&2
              exit 1
            fi
            # Proposed ledger is durably saved under /tmp. Reset the dirty
            # checkout so git can switch to an existing rolling branch.
            git restore -- "$LEDGER"
            git switch -c "$BRANCH" FETCH_HEAD
          else
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
              echo "::error::Rolling branch unexpectedly exists; refusing overwrite." >&2
              exit 1
            else
              rc=$?
              if [ "$rc" -ne 2 ]; then
                echo "::error::Rolling branch lookup failed (exit $rc)." >&2
                exit 1
              fi
            fi
            git switch -c "$BRANCH"
          fi
          cp /tmp/ci-predict-proposed-ledger.jsonl "$LEDGER"
          git config user.name "ci-predict-consolidate[bot]"
          git config user.email "ci-predict-consolidate@users.noreply.github.com"
          git add -- "$LEDGER"
          git diff --cached --quiet && { echo "No new branch changes"; exit 0; }
          git commit -m "chore(ci-predict): append verified daily calibration batch"
          git push --set-upstream origin "HEAD:refs/heads/$BRANCH"
          if [ -z "$ROLLING_PR" ]; then
            gh pr create --repo "$REPO" --base main --head "$BRANCH" \
              --title "ci-predict: consolidate resolved CI predictions" \
              --body "Bounded daily single-writer ledger rollup. Append-only chain and fresh CI outcomes verified. Data review only; no authorization or automatic merge. Verify ledger and independent review at exact head."
          else
            echo "Updated existing rolling PR #$ROLLING_PR (no new PR)."
          fi
