name: copilot-base-guard

# Anti-cascade for bot PRs (molt rule 2 applied to Copilot):
# a copilot/* head may only target the default branch. A PR that targets another
# copilot/* branch is a fix stacked on a fix — the pattern that produced the
# five-deep zero-diff merge chain behind PR #250. This job retargets such PRs to
# main mechanically and leaves a comment; if it cannot retarget, it fails the check.
#
# Rulesets cannot express "restrict base by head pattern" — they condition on the
# target branch only — so this lives in code. Required-check name: "base-guard".

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  base-guard:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'copilot/')
    steps:
      - name: Enforce default-branch base for copilot/* heads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          DEFAULT: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$BASE" = "$DEFAULT" ]; then
            echo "OK: $HEAD -> $BASE"
            exit 0
          fi
          echo "::warning::copilot head '$HEAD' targets '$BASE', not '$DEFAULT'. Retargeting."
          if gh api -X PATCH "repos/$REPO/pulls/$PR" -f base="$DEFAULT" >/dev/null; then
            gh pr comment "$PR" --repo "$REPO" --body "copilot-base-guard: base changed from \`$BASE\` to \`$DEFAULT\`. Bot heads may only target the default branch (anti-cascade; see PR #250 chain). Checks will re-run against \`$DEFAULT\`."
            echo "Retargeted to $DEFAULT."
            exit 0
          fi
          echo "::error::Could not retarget PR #$PR to $DEFAULT. Change the base manually (Edit → base: $DEFAULT)."
          exit 1
