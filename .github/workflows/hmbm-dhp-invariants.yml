name: HMBM DHP invariants
on:
  pull_request:
    paths:
      - 'experiments/hmbm/dhp/**'
      - 'experiments/hmbm/cycle-003/dhp-*'
      - 'experiments/hmbm/cycle-003/DHP_REPOSITORY_QUEUE.md'
      - 'experiments/hmbm/cycle-003/queue/**'
      - 'experiments/hmbm/cycle-003/evidence/C003-DHP-*'
      - '.github/workflows/hmbm-dhp-invariants.yml'
  push:
    paths:
      - 'experiments/hmbm/dhp/**'
      - 'experiments/hmbm/cycle-003/dhp-*'
      - 'experiments/hmbm/cycle-003/DHP_REPOSITORY_QUEUE.md'
      - 'experiments/hmbm/cycle-003/queue/**'
      - 'experiments/hmbm/cycle-003/evidence/C003-DHP-*'
      - '.github/workflows/hmbm-dhp-invariants.yml'
jobs:
  invariant-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run DHP unit tests
        run: python -m unittest discover -s experiments/hmbm/dhp -p 'test_*.py'
      - name: Validate repository queue transport references
        run: python experiments/hmbm/dhp/validate_queue.py
