name: governance-invariant-evaluator
on:
  pull_request:
    paths:
      - 'tools/governance_invariant_evaluator.py'
      - 'tests/test_governance_invariant_evaluator.py'
      - '.github/workflows/governance-invariant-evaluator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invariant-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p test_governance_invariant_evaluator.py -v
