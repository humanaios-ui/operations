name: document-control

# Phase 2 gate. The registry + frontmatter integrity check (validate.py) is the
# ERROR gate — it blocks on structural controlled-document violations. Prose
# (markdownlint) and internal-link checks run ADVISORY (continue-on-error) per
# DOCUMENT_CONTROL_PLAN.md §4 ("advisory checks ... as warnings"); promote them
# to blocking in a later phase once the doc corpus is clean.

on:
  pull_request:
    paths:
      - "**/*.md"
      - "document-registry.yaml"
      - ".doc-control/**"
      # The gate must run on a PR that changes only the gate itself.
      - ".github/workflows/document-control.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "document-registry.yaml"
      - ".doc-control/**"
      - ".github/workflows/document-control.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install deps
        run: pip install --quiet pyyaml
      - name: Renderer self-test
        run: python3 .doc-control/render.py --smoke-test

      - name: Review scheduler self-test
        run: python3 .doc-control/review.py --smoke-test

      - name: Registry + frontmatter integrity (ERROR — blocks merge)
        run: python3 .doc-control/validate.py

      - name: Review schedule is derived, not hand-set (ERROR — blocks merge)
        # A review_due that contradicts its own last_reviewed + interval means
        # somebody moved a date without a review happening. Overdue itself stays
        # advisory (validate.py rule 7) — being late is not a merge defect.
        run: python3 .doc-control/review.py --check

      - name: CONTROLLED_DOCUMENTS.md is in sync (ERROR — blocks merge)
        run: python3 .doc-control/render.py --check
      - name: Markdown lint (ADVISORY — warns, does not block)
        continue-on-error: true
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            #node_modules
      - name: Internal link check (ADVISORY — warns, does not block)
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--offline --no-progress './**/*.md'"
          fail: true
