name: attractor-observatory-e0
# Read-only. Structural routing is not a record of human value.
on:
  pull_request:
    paths:
      - 'tools/attractor_observatory_e0.py'
      - 'tests/test_attractor_observatory_e0.py'
      - 'docs/ATTRACTOR_OBSERVATORY_E0.md'
      - 'system_graph.json'
      - '.github/workflows/attractor-observatory-e0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Falsifier tests
        run: python3 -m unittest discover -s tests -p 'test_attractor_observatory_e0.py' -v
      - name: Structural observation only
        run: |
          python3 tools/attractor_observatory_e0.py --graph system_graph.json --output "$RUNNER_TEMP/attractor-e0.json"
          python3 - "$RUNNER_TEMP/attractor-e0.json" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1], encoding='utf-8'))
          assert r['authority_effect'] == 'NONE' and r['execution'] == 'DISABLED'
          assert r['internal']['mode'] == 'STRUCTURAL_POSSIBILITY_ONLY'
          assert r['observed_returns']['state'] == 'NOT_MEASURED'
          assert r['external_conversion']['state'] == 'NOT_MEASURED'
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: attractor-e0-${{ github.sha }}
          path: ${{ runner.temp }}/attractor-e0.json
          retention-days: 7
