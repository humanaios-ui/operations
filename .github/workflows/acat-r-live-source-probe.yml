name: ACAT-R one-shot live official source probe
on:
  push:
    branches:
      - test/acat-r-miner-currentness-pilot-20261030
    paths:
      - '.github/workflows/acat-r-live-source-probe.yml'
permissions:
  contents: read

jobs:
  official-source-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read only official Convergent Research posting
        shell: bash
        env:
          SOURCE_URL: https://jobs.lever.co/convergentresearch/7b0506c1-caf2-4e92-9a44-d062c7a9b988
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError, URLError
          import json
          import os

          class NoRedirects(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          url = os.environ["SOURCE_URL"]
          assert url == "https://jobs.lever.co/convergentresearch/7b0506c1-caf2-4e92-9a44-d062c7a9b988"
          request = Request(url, headers={"User-Agent": "HumanAIOS-ACAT-R-readonly-source-probe/0.1"})
          state = {"schema": "humanaios.acat-r.live-source-readback.v0.1",
                   "source_url": url,
                   "observed_at": datetime.now(timezone.utc).isoformat(),
                   "method": "HTTPS_GET_NO_REDIRECT", "http_status": None,
                   "outcome": "INCONCLUSIVE"}
          try:
              with build_opener(NoRedirects()).open(request, timeout=12) as response:
                  state["http_status"] = response.status
                  state["outcome"] = "HTTP_RESPONSE_OBSERVED"
          except HTTPError as exc:
              state["http_status"] = exc.code
              state["outcome"] = "HTTP_RESPONSE_OBSERVED"
          except (URLError, TimeoutError, OSError) as exc:
              state["failure_type"] = type(exc).__name__
          receipt = json.dumps(state, sort_keys=True, indent=2)
          with open(os.path.join(os.environ["RUNNER_TEMP"], "acat-r-source-readback.json"), "w") as f:
              f.write(receipt + "\n")
          print(receipt)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acat-r-official-source-readback
          path: ${{ runner.temp }}/acat-r-source-readback.json
          if-no-files-found: error
