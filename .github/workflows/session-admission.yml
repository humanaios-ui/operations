name: session-admission

# Issue-first work admission and exact-SHA pre-PR validation.
#
# Trust split:
#   issue / metadata — run default-branch coordinator code only.
#   candidate checks  — check out the bound SHA with read-only permissions,
#                       no persisted credentials, and no repository secrets.
#   receipt           — has issue write permission but runs no candidate code.
#
# Admission and preflight are working-set evidence only. Neither authorizes
# review approval, merge, deployment, or any Z3 action.

on:
  issues:
    types: [opened, edited, reopened, closed]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Session-graph issue number
        required: true
        type: string
      branch:
        description: Optional issue-bound branch to preflight
        required: false
        type: string

permissions: {}

concurrency:
  group: session-admission-${{ github.event.issue.number || inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  issue-state:
    name: Validate session graph
    if: >-
      ${{
        github.event_name == 'issues' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request == null &&
         (github.event.action == 'deleted' ||
          startsWith(github.event.comment.body, '/admit') ||
          startsWith(github.event.comment.body, '/defer') ||
          startsWith(github.event.comment.body, '/reject')))
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      issue_number: ${{ steps.collect.outputs.issue_number }}
      report_b64: ${{ steps.report.outputs.report_b64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Collect issue and decision evidence
        id: collect
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        with:
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.ISSUE_NUMBER);
            if (!Number.isInteger(issue_number) || issue_number < 1) {
              core.setFailed("A valid issue number is required.");
              return;
            }
            const [issueResponse, comments] = await Promise.all([
              github.rest.issues.get({ owner, repo, issue_number }),
              github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number, per_page: 100 }
              )
            ]);
            const issue = issueResponse.data;
            if (issue.pull_request) {
              core.setFailed("Session admission applies to issues, not PR conversations.");
              return;
            }
            const snapshot = {
              schema_version: "0.1",
              issue: {
                number: issue.number,
                title: issue.title || "",
                body: issue.body || "",
                state: issue.state,
                html_url: issue.html_url,
                author: issue.user && issue.user.login ? issue.user.login : "unknown",
                labels: (issue.labels || []).map(x =>
                  typeof x === "string" ? x : x.name
                ).filter(Boolean),
                comments: comments.map(comment => ({
                  id: comment.id,
                  body: comment.body || "",
                  created_at: comment.created_at,
                  updated_at: comment.updated_at,
                  user: {
                    login: comment.user && comment.user.login
                      ? comment.user.login : "unknown"
                  }
                }))
              }
            };
            fs.mkdirSync(".session-admission", { recursive: true });
            fs.writeFileSync(
              ".session-admission/issue-snapshot.json",
              JSON.stringify(snapshot, null, 2)
            );
            core.setOutput("issue_number", String(issue_number));

      - name: Evaluate session graph from trusted policy
        id: validate
        continue-on-error: true
        run: |
          python3 tools/repository_coordinator_v0_1.py \
            --issue-snapshot .session-admission/issue-snapshot.json \
            --policy REPOSITORY_COORDINATOR_POLICY.json \
            --output .session-admission/issue-result.json

      - name: Prepare human status report
        id: report
        if: always()
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          path = Path(".session-admission/issue-result.json")
          if path.exists():
              result = json.loads(path.read_text(encoding="utf-8"))
              missing = ", ".join(result["missing_sections"]) or "none"
              empty = ", ".join(result["empty_sections"]) or "none"
              admission = result["admission"]
              body = "\n".join([
                  "<!-- session-admission-status -->",
                  "## Session admission status",
                  "",
                  "| Check | Result |",
                  "|---|---|",
                  f"| Session graph structure | **{result['structure_gate']}** |",
                  f"| Admission state | **{admission['state']}** |",
                  f"| Decision source | {admission.get('source') or 'none'} |",
                  f"| Preflight eligible | **{'YES' if result['preflight_eligible'] else 'NO'}** |",
                  "",
                  f"Missing sections: {missing}  ",
                  f"Empty sections: {empty}",
                  "",
                  f"Evidence: {admission['evidence']}",
                  "",
                  "_Issue creation is not admission. Admission is not merge authority._",
              ])
          else:
              body = "\n".join([
                  "<!-- session-admission-status -->",
                  "## Session admission status",
                  "",
                  "**FAIL — validation evidence was not produced.** The workflow fails closed.",
              ])
          encoded = base64.b64encode(body.encode()).decode()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"report_b64={encoded}\n")
          PY

      - name: Upload issue evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: session-admission-issue-${{ steps.collect.outputs.issue_number }}
          path: .session-admission/
          retention-days: 30
          if-no-files-found: ignore

      - name: Enforce session graph structure
        if: steps.validate.outcome != 'success'
        run: exit 1

  publish-issue-state:
    name: Publish session status
    if: always() && needs.issue-state.outputs.report_b64 != ''
    needs: issue-state
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ needs.issue-state.outputs.issue_number }}
          REPORT_B64: ${{ needs.issue-state.outputs.report_b64 }}
        with:
          script: |
            const marker = "<!-- session-admission-status -->";
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.ISSUE_NUMBER);
            let body = Buffer.from(process.env.REPORT_B64 || "", "base64")
              .toString("utf8");
            if (!body.includes(marker)) {
              body = marker + "\n## Session admission status\n\nInvalid status payload; evidence withheld.";
            }
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find(comment =>
              comment.user && comment.user.type === "Bot" &&
              typeof comment.body === "string" && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  preflight-metadata:
    name: Bind issue to exact branch SHA
    if: >-
      ${{
        (github.event_name == 'issue_comment' &&
         github.event.action != 'deleted' &&
         github.event.issue.pull_request == null &&
         startsWith(github.event.comment.body, '/preflight ')) ||
        (github.event_name == 'workflow_dispatch' && inputs.branch != '')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      gate: ${{ steps.result.outputs.gate }}
      issue_number: ${{ steps.collect.outputs.issue_number }}
      branch: ${{ steps.collect.outputs.branch }}
      head_sha: ${{ steps.collect.outputs.head_sha }}
      base_sha: ${{ steps.collect.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Resolve request and collect immutable binding evidence
        id: collect
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          REQUEST_BODY: ${{ github.event.comment.body || format('/preflight {0}', inputs.branch) }}
        with:
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.ISSUE_NUMBER);
            const request = String(process.env.REQUEST_BODY || "").trim();
            const match = request.match(/^\/preflight\s+([A-Za-z0-9._/-]+)\s*$/);
            if (!Number.isInteger(issue_number) || issue_number < 1 || !match) {
              core.setFailed("Use exactly `/preflight <branch>` on a session issue.");
              return;
            }
            const branch = match[1];
            if (branch.includes("..") || branch.startsWith("/") || branch.endsWith("/")) {
              core.setFailed("Unsafe or malformed branch name.");
              return;
            }

            const policy = JSON.parse(
              fs.readFileSync("REPOSITORY_COORDINATOR_POLICY.json", "utf8")
            );
            const authorized = new Set(
              (((policy || {}).session_admission || {}).authorized_actors || [])
                .map(x => String(x).toLowerCase())
            );
            const requester = String(context.actor || "").toLowerCase();
            if (!authorized.has(requester)) {
              core.setFailed(`Actor ${context.actor} is not authorized to request preflight.`);
              return;
            }

            const defaultBranch = context.payload.repository.default_branch;
            const [issueResponse, comments, branchResponse, comparison, pulls] = await Promise.all([
              github.rest.issues.get({ owner, repo, issue_number }),
              github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number, per_page: 100 }
              ),
              github.rest.repos.getBranch({ owner, repo, branch }),
              github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: `${defaultBranch}...${branch}`, per_page: 100
              }),
              github.rest.pulls.list({
                owner, repo, state: "open", head: `${owner}:${branch}`, per_page: 100
              })
            ]);
            const issue = issueResponse.data;
            if (issue.pull_request) {
              core.setFailed("Preflight must be requested from a session issue.");
              return;
            }
            const commits = comparison.data.commits || [];
            const files = comparison.data.files || [];
            const head_sha = branchResponse.data.commit.sha;
            const base_sha = comparison.data.base_commit.sha;
            const snapshot = {
              schema_version: "0.1",
              issue: {
                number: issue.number,
                title: issue.title || "",
                body: issue.body || "",
                state: issue.state,
                html_url: issue.html_url,
                labels: (issue.labels || []).map(x =>
                  typeof x === "string" ? x : x.name
                ).filter(Boolean),
                comments: comments.map(comment => ({
                  id: comment.id,
                  body: comment.body || "",
                  created_at: comment.created_at,
                  updated_at: comment.updated_at,
                  user: {
                    login: comment.user && comment.user.login
                      ? comment.user.login : "unknown"
                  }
                }))
              },
              branch: {
                name: branch,
                head_sha,
                base_sha,
                first_commit_message: commits.length
                  ? commits[0].commit.message : "",
                changed_files: files.map(file => file.filename),
                files_complete: files.length < 300,
                open_pull_requests: (pulls.data || []).map(pull => pull.number)
              }
            };
            fs.mkdirSync(".session-admission", { recursive: true });
            fs.writeFileSync(
              ".session-admission/preflight-snapshot.json",
              JSON.stringify(snapshot, null, 2)
            );
            core.setOutput("issue_number", String(issue_number));
            core.setOutput("branch", branch);
            core.setOutput("head_sha", head_sha);
            core.setOutput("base_sha", base_sha);

      - name: Enforce admission and branch binding
        id: validate
        continue-on-error: true
        run: |
          python3 tools/repository_coordinator_v0_1.py \
            --preflight-snapshot .session-admission/preflight-snapshot.json \
            --policy REPOSITORY_COORDINATOR_POLICY.json \
            --output .session-admission/preflight-result.json

      - name: Expose metadata decision
        id: result
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(".session-admission/preflight-result.json")
          gate = "FAIL"
          if path.exists():
              gate = json.loads(path.read_text(encoding="utf-8")).get("gate", "FAIL")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"gate={gate}\n")
          PY

      - name: Upload metadata evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: session-preflight-metadata-${{ steps.collect.outputs.issue_number }}-${{ steps.collect.outputs.head_sha }}
          path: .session-admission/
          retention-days: 30
          if-no-files-found: ignore

      - name: Fail closed on invalid metadata
        if: steps.result.outputs.gate != 'PASS'
        run: exit 1

  candidate-quality:
    name: Pre-PR quality and integrity
    needs: preflight-metadata
    if: needs.preflight-metadata.outputs.gate == 'PASS'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight-metadata.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install fixed validation dependencies
        run: python3 -m pip install --quiet cryptography pyyaml pytest mypy ruff jsonschema

      - name: Diff integrity
        env:
          BASE_SHA: ${{ needs.preflight-metadata.outputs.base_sha }}
          HEAD_SHA: ${{ needs.preflight-metadata.outputs.head_sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"

      - name: Repository, document, and tool integrity
        run: |
          python3 tools/repo_health.py --strict
          bash scripts/verify_pr_readiness.sh --verbose

      - name: Workflow syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          for path in sorted(Path(".github/workflows").glob("*.y*ml")):
              with path.open(encoding="utf-8") as handle:
                  list(yaml.safe_load_all(handle))
              print(f"PASS {path}")
          PY

      - name: Lint and type baseline
        run: |
          python3 -m ruff check --select=E9,F63,F7,F82 \
            src/humanaios_operations acat/api/services tools/tests tests
          python3 -m mypy src/humanaios_operations --ignore-missing-imports

      - name: Test baseline
        run: |
          python3 -m pytest \
            tools/tests/test_assess_router_structure.py \
            tools/tests/test_behavioral_compliance_gate.py \
            tools/tests/test_ci_suite_enumeration.py \
            tools/tests/test_clone_sync_health.py \
            tools/tests/test_intake_schema_v0_2.py \
            tools/tests/test_orchestrator_molt.py \
            tools/tests/test_pre_push_gate.py \
            tools/tests/test_repository_coordinator_v0_1.py \
            tools/tests/test_registry_site_generator.py \
            tools/tests/test_tool_gap_scaffolds.py \
            test_specimen_intake_evaluator.py \
            test_specimen_intake_nf_ledger.py \
            tools/tests/test_molt_cycle_nf_read.py \
            test_resource_economics.py \
            tools/tests/test_builder_compliance_scanner.py \
            tools/tests/test_molt_tier_classifier.py \
            tools/tests/test_ratify_index_write.py \
            tools/tests/test_smag_predict_lint.py \
            tools/tests/test_smag_feedback.py \
            tools/tests/test_nf_ledger_cli.py \
            tools/tests/test_ci_predict.py \
            tools/tests/test_lifecycle_predict.py \
            tools/tests/test_dimension_attribution.py \
            tools/tests/test_tool_trace_hook.py \
            tools/tests/test_tool_trace_reader.py \
            tools/tests/test_copilot_acat_scanner.py \
            tools/tests/test_grant_match_verifier.py \
            tools/tests/test_grant_matching_engine.py \
            tools/tests/test_holographic_integration.py \
            tools/tests/test_holographic_orchestrator.py \
            tools/tests/test_holographic_phase3_live.py \
            tools/tests/test_industry_telemetry.py \
            tools/tests/test_nonprofit_dashboard.py \
            tools/tests/test_smag_gate_enforcer_v1_0.py \
            acat/tests/test_tool_trace_schema.py \
            -q

  candidate-secrets:
    name: Pre-PR secret scan
    needs: preflight-metadata
    if: needs.preflight-metadata.outputs.gate == 'PASS'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight-metadata.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

  candidate-dependencies:
    name: Pre-PR dependency scan
    needs: preflight-metadata
    if: needs.preflight-metadata.outputs.gate == 'PASS'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight-metadata.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Audit changed Python requirements
        env:
          BASE_SHA: ${{ needs.preflight-metadata.outputs.base_sha }}
          HEAD_SHA: ${{ needs.preflight-metadata.outputs.head_sha }}
        run: |
          python3 -m pip install --quiet pip-audit
          mapfile -t reqs < <(
            git diff --diff-filter=ACMR --name-only "$BASE_SHA" "$HEAD_SHA" \
              | grep -E '(^|/)requirements[^/]*\.txt$' \
              | sort \
              || true
          )
          if [ "${#reqs[@]}" -eq 0 ]; then
            echo "No changed requirements files."
            exit 0
          fi
          for req in "${reqs[@]}"; do
            if [ "$req" = "tools/Metaculus/requirements.txt" ]; then
              python3 -m pip_audit \
                --ignore-vuln PYSEC-2026-36 \
                --ignore-vuln PYSEC-2026-3552 \
                --ignore-vuln PYSEC-2026-3553 \
                --ignore-vuln PYSEC-2026-3554 \
                --ignore-vuln GHSA-537c-gmf6-5ccf \
                -r "$req"
            else
              python3 -m pip_audit -r "$req"
            fi
          done

  publish-preflight:
    name: Publish SHA-bound preflight receipt
    if: always() && needs.preflight-metadata.outputs.issue_number != ''
    needs:
      - preflight-metadata
      - candidate-quality
      - candidate-secrets
      - candidate-dependencies
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ needs.preflight-metadata.outputs.issue_number }}
          BRANCH: ${{ needs.preflight-metadata.outputs.branch }}
          HEAD_SHA: ${{ needs.preflight-metadata.outputs.head_sha }}
          METADATA_RESULT: ${{ needs.preflight-metadata.result }}
          QUALITY_RESULT: ${{ needs.candidate-quality.result }}
          SECRETS_RESULT: ${{ needs.candidate-secrets.result }}
          DEPENDENCIES_RESULT: ${{ needs.candidate-dependencies.result }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.ISSUE_NUMBER);
            const sha = process.env.HEAD_SHA || "unknown";
            const marker = `<!-- session-preflight:${sha} -->`;
            const results = {
              metadata: process.env.METADATA_RESULT,
              quality_integrity: process.env.QUALITY_RESULT,
              secret_scan: process.env.SECRETS_RESULT,
              dependency_scan: process.env.DEPENDENCIES_RESULT
            };
            const passed = Object.values(results).every(value => value === "success");
            const rows = Object.entries(results)
              .map(([name, result]) => `| ${name} | **${String(result).toUpperCase()}** |`)
              .join("\n");
            const body = [
              marker,
              "## Pre-PR validation receipt",
              "",
              `**${passed ? "PASS" : "FAIL"}** for branch \`${process.env.BRANCH}\` at exact commit \`${sha}\`.`,
              "",
              "| Check group | Result |",
              "|---|---|",
              rows,
              "",
              `[Workflow evidence](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})`,
              "",
              "_A later commit invalidates this receipt. Preflight is not PR validation or merge authority._"
            ].join("\n");
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find(comment =>
              comment.user && comment.user.type === "Bot" &&
              typeof comment.body === "string" && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
