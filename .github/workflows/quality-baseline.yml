name: quality-baseline

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tools/**'
      - 'acat/**'
      - 'tests/**'
      - 'calibration_profiles/**'
      - 'audits/**'
      - 'requirements.txt'
      - 'setup.py'
      - '.github/workflows/quality-baseline.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'acat/**'
      - 'tests/**'
      - 'calibration_profiles/**'
      - 'audits/**'
      - 'requirements.txt'
      - 'setup.py'
      - '.github/workflows/quality-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install quality deps
        run: |
          python3 -m pip install --quiet cryptography pyyaml pytest mypy ruff jsonschema

      - name: SMAG calibration state review (advisory only)
        run: |
          python3 tools/smag_gate_enforcer_v1_0.py \
            --profile-path calibration_profiles/BASELINE_S092126.json \
            --ledger-path audits/smag_pilot_ledger.jsonl \
            --substrate "human:humanaios-ui" \
            --advisory-only
          echo "✓ SMAG calibration state reported (no merge authority on quality-baseline)"

      - name: Repository health baseline (blocking)
        run: python3 tools/repo_health.py --strict

      - name: Document-control integrity (blocking)
        run: python3 .doc-control/validate.py

      - name: Lint baseline (blocking)
        run: |
          python3 -m ruff check --select=E9,F63,F7,F82 \
            src/humanaios_operations \
            acat/api/services \
            tools/tests \
            tests

      - name: Type-check baseline (blocking)
        run: |
          python3 -m mypy src/humanaios_operations --ignore-missing-imports

      - name: Pytest baseline suites (blocking)
        run: |
          python3 << 'PYTEST_RUNNER_EOF'
          import yaml
          import subprocess

          # Load baseline tests from single source of truth
          with open('.tool-control/baseline_tests.yaml') as f:
              cfg = yaml.safe_load(f)

          # Extract test paths (always run; skip decorators handle unavailable deps)
          tests = [t['path'] for t in cfg['baseline_tests']]

          # Run pytest with loaded test paths
          cmd = ['python3', '-m', 'pytest'] + tests + ['-q']
          result = subprocess.run(cmd)
          exit(result.returncode)
          PYTEST_RUNNER_EOF

      - name: Emit Workflow Telemetry (Phase 2B)
        if: always()
        run: |
          python3 << 'TELEMETRY_EOF'
          import json
          from datetime import datetime

          telemetry = {
              "timestamp": datetime.utcnow().isoformat() + "Z",
              "workflow": "quality-baseline",
              "trigger_reason": "${{ github.event_name }}",
              "path_filter_active": True,
              "path_filter_hit": True,
              "validation_result": "${{ job.status }}"
          }

          # Add PR context if available
          if "${{ github.event_name }}" == "pull_request":
              telemetry["pr_number"] = "${{ github.event.pull_request.number }}"
              telemetry["pr_title"] = "${{ github.event.pull_request.title }}"

          with open("telemetry.json", "w") as f:
              json.dump(telemetry, f, indent=2)
          TELEMETRY_EOF

      - name: Upload Telemetry Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workflow-telemetry-quality-baseline
          path: telemetry.json
          retention-days: 30