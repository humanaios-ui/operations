name: quality-baseline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install quality deps
        run: |
          python3 -m pip install --quiet cryptography pyyaml pytest mypy ruff jsonschema

      - name: Repository health baseline (blocking)
        run: python3 tools/repo_health.py --strict

      - name: Document-control integrity (blocking)
        run: python3 .doc-control/validate.py

      - name: Lint baseline (blocking)
        run: |
          python3 -m ruff check --select=E9,F63,F7,F82 \
            src/humanaios_operations \
            acat/api/services \
            tools/tests \
            tests

      - name: Type-check baseline (blocking)
        run: |
          python3 -m mypy src/humanaios_operations --ignore-missing-imports

      - name: Pytest baseline suites (blocking)
        run: |
          python3 -m pytest \
            tools/tests/test_behavioral_compliance_gate.py \
            test_specimen_intake_evaluator.py \
            tools/tests/test_builder_compliance_scanner.py \
            tools/tests/test_smag_predict_lint.py \
            tools/tests/test_nf_ledger_cli.py \
            tools/tests/test_ci_predict.py \
            tools/tests/test_lifecycle_predict.py \
            tools/tests/test_dimension_attribution.py \
            tools/tests/test_tool_trace_hook.py \
            tools/tests/test_tool_trace_reader.py \
            acat/tests/test_tool_trace_schema.py \
            -q
