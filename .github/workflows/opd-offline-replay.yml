name: OPD offline replay (advisory)
on:
  pull_request:
    paths:
      - 'tools/opd/**'
      - 'tests/test_opd_offline.py'
      - '.github/workflows/opd-offline-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Canonical manifest regeneration preview (read-only)
        run: |
          python -m pip install PyYAML
          python .tool-control/scan.py
          git diff -- tools-manifest.yaml
      - name: Offline safety and replay regression
        run: python -m unittest discover -s tests -p test_opd_offline.py -v
