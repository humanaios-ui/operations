name: Resource Miner PR

on:
  pull_request:
    paths:
      - 'humanaios-funding-pipeline/resource-miner/**'
      - '.github/workflows/resource-miner-pr.yml'
      - '.github/workflows/resource-miner-scan.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run Resource Miner regression tests
        working-directory: humanaios-funding-pipeline/resource-miner
        env:
          HACKERONE_API_USERNAME: ''
          HACKERONE_API_TOKEN: ''
        run: python3 -m unittest discover -s tests -v

      - name: Exercise persistent Mine resolver contract
        working-directory: humanaios-funding-pipeline/resource-miner
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HACKERONE_API_USERNAME: ''
          HACKERONE_API_TOKEN: ''
        run: |
          python3 -m resource_miner.cli resolve-mines --dry-run > /tmp/mine-resolution.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/mine-resolution.json").read_text())
          assert payload["mines"], "mine registry unexpectedly empty"
          assert any(m["name"] == "Microsoft for Startups" for m in payload["mines"])
          assert any(m["name"] == "HackerOne" for m in payload["mines"])
          states = {r["mine_name"]: r["state"] for r in payload["receipts"]}
          assert states["Microsoft for Startups"] == "RESOLVED"
          assert states["humanaios-ui/operations"] == "ROLE_ONLY"
          assert states["humanaios-ui/humanaios"] == "ROLE_ONLY"
          assert states["humanaios-ui/lasting-light-ai"] == "ROLE_ONLY"
          assert states["HackerOne"] in {"DEPENDENCY_PENDING", "OBSERVATION_FAILED", "RESOLVED"}
          assert states["aioshuman@gmail.com — Private Gmail"] == "DEPENDENCY_PENDING"
          opportunities = payload["opportunities"]
          propositions = payload["propositions"]
          resolutions = payload["resolutions"]
          adjudications = payload["adjudications"]
          verification_frontier = payload["verification_frontier"]
          verification_work_queue = payload["verification_work_queue"]
          claims = payload["claims"]
          assert any(row["mine_name"] == "Microsoft for Startups" for row in opportunities)
          assert all(row["opportunity_id"].startswith("OPP-") for row in opportunities)
          assert all(row["opportunity_token"].startswith("urn:humanaios:resource-opportunity:") for row in opportunities)
          assert len(propositions) >= len(opportunities)
          assert resolutions
          assert len(adjudications) == len(resolutions)
          assert len(claims) == len(propositions)
          assert all(row["proposition_id"].startswith("PRP-") for row in propositions)
          assert all(row["proposition_token"].startswith("urn:humanaios:proposition:") for row in propositions)
          assert all(row["resolution_subject_key"] for row in propositions)
          assert all(row["source_origin_key"] for row in propositions)
          assert all(row["resolution_set_id"].startswith("PRS-") for row in resolutions)
          assert all(row["resolution_token"].startswith("urn:humanaios:proposition-resolution:") for row in resolutions)
          assert all(row["truth_state"] == "NOT_DETERMINED" for row in resolutions)
          assert all(row["authorization_state"] == "NOT_REQUESTED" for row in resolutions)
          assert all(row["authority_effect"] == "NONE" for row in resolutions)
          assert all(row["distinct_origin_count"] <= row["distinct_source_count"] for row in resolutions)
          assert all(row["state"] in {"SINGLE_SOURCE", "CORROBORATED", "CONTESTED", "QUALIFIED", "SUPERSEDED", "UNRESOLVED"} for row in resolutions)
          assert all(row["adjudication_id"].startswith("PAD-") for row in adjudications)
          assert all(row["truth_state"] == "NOT_DETERMINED" for row in adjudications)
          assert all(row["authorization_state"] == "NOT_REQUESTED" for row in adjudications)
          assert all(row["authority_effect"] == "NONE" for row in adjudications)
          assert all(row["posture"] in {"PRIMARY_SOURCE_PRESENT", "MULTI_ORIGIN_NO_PRIMARY", "NONPRIMARY_SOURCE_ONLY", "DERIVED_ONLY", "CONTESTED", "UNRESOLVED", "SOURCE_STANDING_UNKNOWN"} for row in adjudications)
          assert all(row["verification_id"].startswith("VFY-") for row in verification_frontier)
          assert all(row["state"] == "OPEN" for row in verification_frontier)
          assert all(row["authority_effect"] == "NONE" for row in verification_frontier)
          assert len(verification_work_queue) == len(verification_frontier)
          assert all(row["work_id"].startswith("VWK-") for row in verification_work_queue)
          assert all(row["planning_state"] == "PLANNED" for row in verification_work_queue)
          assert all(row["execution_state"] == "NOT_AUTHORIZED" for row in verification_work_queue)
          assert all(row["authority_effect"] == "NONE" for row in verification_work_queue)
          assert all(row["claim_id"].startswith("CLM-") for row in claims)
          assert all(row["claim_token"].startswith("urn:humanaios:opportunity-claim:") for row in claims)
          assert all(row["authorization_state"] == "NOT_REQUESTED" for row in claims)
          assert all(row["actionability_state"] == "NOT_ACTIONABLE" for row in claims)
          assert all(row["proposition_id"].startswith("PRP-") for row in claims)
          assert len({row["claim_id"] for row in claims}) == len(claims)
          for row in claims:
              facets = {f["name"]: f["state"] for f in row["facets"]}
              assert facets["ELIGIBILITY"] == "UNASSESSED"
              assert facets["ATTAINABILITY"] == "UNASSESSED"
          PY
