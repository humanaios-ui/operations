name: Resource Miner PR

on:
  pull_request:
    paths:
      - 'humanaios-funding-pipeline/resource-miner/**'
      - '.github/workflows/resource-miner-pr.yml'
      - '.github/workflows/resource-miner-scan.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run Resource Miner regression tests
        working-directory: humanaios-funding-pipeline/resource-miner
        env:
          HACKERONE_API_USERNAME: ''
          HACKERONE_API_TOKEN: ''
        run: python3 -m unittest discover -s tests -v

      - name: Exercise persistent Mine resolver contract
        working-directory: humanaios-funding-pipeline/resource-miner
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HACKERONE_API_USERNAME: ''
          HACKERONE_API_TOKEN: ''
        run: |
          python3 -m resource_miner.cli resolve-mines --dry-run > /tmp/mine-resolution.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/mine-resolution.json").read_text())
          assert payload["mines"], "mine registry unexpectedly empty"
          assert any(m["name"] == "Microsoft for Startups" for m in payload["mines"])
          assert any(m["name"] == "HackerOne" for m in payload["mines"])
          states = {r["mine_name"]: r["state"] for r in payload["receipts"]}
          assert states["Microsoft for Startups"] == "RESOLVED"
          assert states["humanaios-ui/operations"] == "ROLE_ONLY"
          assert states["humanaios-ui/humanaios"] == "ROLE_ONLY"
          assert states["humanaios-ui/lasting-light-ai"] == "ROLE_ONLY"
          assert states["HackerOne"] in {"DEPENDENCY_PENDING", "OBSERVATION_FAILED", "RESOLVED"}
          opportunities = payload["opportunities"]
          assert any(row["mine_name"] == "Microsoft for Startups" for row in opportunities)
          assert all(row["opportunity_id"].startswith("OPP-") for row in opportunities)
          assert all(row["opportunity_token"].startswith("urn:humanaios:resource-opportunity:") for row in opportunities)
          PY
