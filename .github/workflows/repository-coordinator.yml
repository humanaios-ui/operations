name: repository-coordinator

# Repository-level coordination, admission, and backpressure index.
#
# This workflow never merges, closes, labels, or mutates canonical queue state.
# It separates repository work from operator-attention work and blocks a
# ready non-maintenance PR from claiming active standing without admission.
# Age is not a signal.
#
# Security split:
#   index   — checks out PR-head code with read-only permissions. The policy
#             it applies is fetched from the default branch via the API, so a
#             PR cannot re-route the repository index by editing the policy.
#   comment — has write permission but checks out/runs no PR code. The report
#             body is produced by PR-head code, so the comment is advisory only
#             and says so.
#
# Enforcement (the required check) lives in repository-admission-gate.yml,
# which runs on pull_request_target from the default branch and never checks
# out or executes PR-head code.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: repository-coordinator-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  index:
    if: github.event_name != 'issue_comment'
    name: Build repository coordination index (ADVISORY)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      report_b64: ${{ steps.report.outputs.report_b64 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Collect live repository snapshot
        id: snapshot
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const crypto = require("crypto");
            const { owner, repo } = context.repo;

            const branch = await github.rest.repos.getBranch({
              owner, repo, branch: "main"
            });
            const mainSha = branch.data.commit.sha;

            const gitCommit = await github.rest.git.getCommit({
              owner, repo, commit_sha: mainSha
            });
            const tree = await github.rest.git.getTree({
              owner, repo, tree_sha: gitCommit.data.tree.sha, recursive: "true"
            });
            const mainPaths = (tree.data.tree || [])
              .filter(x => x.type === "blob" && x.path)
              .map(x => x.path);

            const open = await github.paginate(
              github.rest.pulls.list,
              { owner, repo, state: "open", per_page: 100 }
            );

            // Trusted policy: default branch, not the candidate checkout.
            // Bootstrap only: while the policy does not yet exist on main, the
            // advisory index falls back to the checkout and records that it did.
            let policyText;
            let policySource = "main";
            try {
              const policyResp = await github.rest.repos.getContent({
                owner, repo, path: "REPOSITORY_COORDINATOR_POLICY.json", ref: "main"
              });
              policyText = Buffer.from(policyResp.data.content, "base64").toString("utf8");
            } catch (err) {
              if (!err || err.status !== 404) throw err;
              policyText = fs.readFileSync("REPOSITORY_COORDINATOR_POLICY.json", "utf8");
              policySource = "checkout (policy absent on main; bootstrap)";
              core.warning("REPOSITORY_COORDINATOR_POLICY.json is absent on main; advisory index is using the checkout copy.");
            }
            const policy = JSON.parse(policyText);
            fs.mkdirSync(".repo-coordinator", { recursive: true });
            fs.writeFileSync(".repo-coordinator/policy.main.json", policyText);
            fs.writeFileSync(".repo-coordinator/policy.source", policySource);

            let coordinatorState = null;
            let stateBranch = null;
            let stateCommitSha = null;
            let stateProjectionSha256 = null;
            let stateLedgerSha256 = null;
            const stateCfg = (policy || {}).state_source || {};
            if (stateCfg.branch && stateCfg.ledger_path && stateCfg.projection_path) {
              stateBranch = String(stateCfg.branch);
              const branchResp = await github.rest.repos.getBranch({
                owner, repo, branch: stateBranch
              });
              stateCommitSha = branchResp.data.commit.sha;
              const readAt = async path => {
                const response = await github.rest.repos.getContent({
                  owner, repo, path, ref: stateCommitSha
                });
                if (Array.isArray(response.data) || !response.data.content) {
                  throw new Error(`expected file at ${path}@${stateCommitSha}`);
                }
                return Buffer.from(response.data.content, "base64").toString("utf8");
              };
              const [ledgerText, stateText] = await Promise.all([
                readAt(String(stateCfg.ledger_path)),
                readAt(String(stateCfg.projection_path))
              ]);
              coordinatorState = JSON.parse(stateText);
              stateLedgerSha256 = crypto.createHash("sha256").update(ledgerText, "utf8").digest("hex");
              stateProjectionSha256 = crypto.createHash("sha256").update(stateText, "utf8").digest("hex");
              fs.writeFileSync(".repo-coordinator/ADMISSION_LEDGER.jsonl", ledgerText);
              fs.writeFileSync(".repo-coordinator/COORDINATOR_STATE.json", stateText);
            }

            const admittedIssueNumbers = new Set(
              coordinatorState
                ? (coordinatorState.admitted_issue_numbers || []).map(Number)
                : ((((policy || {}).admission || {}).issue_numbers || []).map(Number))
            );
            const maintenanceAuthors = new Set(
              (((policy || {}).maintenance || {}).authors || []).map(String)
            );
            const maintenanceLabels = new Set(
              (((policy || {}).maintenance || {}).labels || []).map(String)
            );

            const pullRequests = [];
            const admissionNumbers = new Set(admittedIssueNumbers);
            const referencedPullNumbers = new Set();
            const closingRefRe = /\b(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s*:?\s*(?:[\w.-]+\/[\w.-]+)?#(\d{1,6})\b/gi;

            // Progressive disclosure:
            // - maintenance: summary only
            // - drafts: changed files only
            // - ready non-maintenance: full files + reviews + merge state
            const chunk = (xs, size) => {
              const out = [];
              for (let i = 0; i < xs.length; i += size) out.push(xs.slice(i, i + size));
              return out;
            };

            for (const batch of chunk(open, 6)) {
              const rows = await Promise.all(batch.map(async brief => {
                const briefLabels = (brief.labels || []).map(x => x.name);
                const author = brief.user && brief.user.login ? brief.user.login : "unknown";
                const isMaintenance =
                  maintenanceAuthors.has(author) ||
                  briefLabels.some(x => maintenanceLabels.has(x));
                const isDraft = Boolean(brief.draft);

                let pr = brief;
                let files = [];
                let reviews = [];
                let filesComplete = false;

                if (isMaintenance) {
                  // No expensive detail calls needed for cohort routing.
                } else if (isDraft) {
                  files = await github.paginate(
                    github.rest.pulls.listFiles,
                    { owner, repo, pull_number: brief.number, per_page: 100 }
                  );
                  filesComplete = true;
                } else {
                  pr = (await github.rest.pulls.get({
                    owner, repo, pull_number: brief.number
                  })).data;
                  [files, reviews] = await Promise.all([
                    github.paginate(
                      github.rest.pulls.listFiles,
                      { owner, repo, pull_number: pr.number, per_page: 100 }
                    ),
                    github.paginate(
                      github.rest.pulls.listReviews,
                      { owner, repo, pull_number: pr.number, per_page: 100 }
                    )
                  ]);
                  filesComplete = true;
                }

                const body = pr.body || brief.body || "";
                const allRefs = [...body.matchAll(/(^|[^\w])#(\d{1,6})\b/g)]
                  .map(match => Number(match[2]));

                for (const number of allRefs) {
                  if (admittedIssueNumbers.has(number)) admissionNumbers.add(number);
                }
                for (const match of body.matchAll(closingRefRe)) {
                  admissionNumbers.add(Number(match[1]));
                }
                for (const match of body.matchAll(/\b(?:PR|pull request)\s*#(\d{1,6})\b/gi)) {
                  referencedPullNumbers.add(Number(match[1]));
                }

                return {
                  number: pr.number,
                  title: pr.title,
                  body,
                  author,
                  labels: briefLabels,
                  html_url: pr.html_url,
                  state: pr.state,
                  draft: isDraft,
                  mergeable: pr.mergeable ?? null,
                  mergeable_state: pr.mergeable_state || "unknown",
                  head_sha: pr.head.sha,
                  base_sha: pr.base.sha,
                  created_at: pr.created_at,
                  updated_at: pr.updated_at,
                  files_complete: filesComplete,
                  files: files.map(f => f.filename),
                  file_details: files.map(f => ({
                    filename: f.filename,
                    status: f.status,
                    patch: f.patch || ""
                  })),
                  reviews: reviews.map(r => ({
                    user: { login: r.user && r.user.login ? r.user.login : "unknown" },
                    state: r.state,
                    submitted_at: r.submitted_at,
                    commit_id: r.commit_id || null
                  }))
                };
              }));
              pullRequests.push(...rows);
            }

            const referenced = {};
            const referencedItems = {};

            for (const batch of chunk([...admissionNumbers], 6)) {
              const rows = await Promise.all(batch.map(async number => {
                try {
                  const issue = (await github.rest.issues.get({
                    owner, repo, issue_number: number
                  })).data;
                  return { number, issue };
                } catch (err) {
                  if (!err || err.status !== 404) throw err;
                  return { number, issue: null };
                }
              }));

              for (const { number, issue } of rows) {
                if (!issue) continue;
                referencedItems[String(number)] = {
                  state: issue.state,
                  html_url: issue.html_url,
                  title: issue.title,
                  body: issue.body || "",
                  labels: (issue.labels || []).map(x =>
                    typeof x === "string" ? x : x.name
                  ).filter(Boolean),
                  is_pull_request: Boolean(issue.pull_request)
                };
              }
            }

            for (const batch of chunk([...referencedPullNumbers], 6)) {
              const rows = await Promise.all(batch.map(async number => {
                try {
                  const pull = (await github.rest.pulls.get({
                    owner, repo, pull_number: number
                  })).data;
                  return { number, pull };
                } catch (err) {
                  if (!err || err.status !== 404) throw err;
                  return { number, pull: null };
                }
              }));

              for (const { number, pull } of rows) {
                if (!pull) continue;
                referenced[String(number)] = {
                  state: pull.state,
                  merged: Boolean(pull.merged_at),
                  html_url: pull.html_url,
                  title: pull.title
                };
              }
            }

            const snapshot = {
              schema_version: coordinatorState ? "0.3" : "0.2",
              repository: `${owner}/${repo}`,
              main_sha: mainSha,
              policy_source: policySource,
              policy_sha256: crypto.createHash("sha256").update(policyText, "utf8").digest("hex"),
              state_branch: stateBranch,
              state_commit_sha: stateCommitSha,
              state_ledger_sha256: stateLedgerSha256,
              state_projection_sha256: stateProjectionSha256,
              main_paths: mainPaths,
              referenced_pull_requests: referenced,
              referenced_items: referencedItems,
              pull_requests: pullRequests
            };

            fs.writeFileSync(
              ".repo-coordinator/snapshot.json",
              JSON.stringify(snapshot, null, 2)
            );

      - name: Self-test coordinator
        run: python3 tools/repository_coordinator_v0_1.py --smoke-test

      - name: Run coordinator regression tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest tools/tests/test_repository_coordinator_v0_1.py -q

      - name: Build advisory index
        if: steps.snapshot.outcome == 'success'
        run: |
          STATE_ARGS=()
          if [ -f .repo-coordinator/COORDINATOR_STATE.json ] && [ -f .repo-coordinator/ADMISSION_LEDGER.jsonl ]; then
            STATE_ARGS+=(--state .repo-coordinator/COORDINATOR_STATE.json)
            STATE_ARGS+=(--ledger .repo-coordinator/ADMISSION_LEDGER.jsonl)
          fi
          python3 tools/repository_coordinator_v0_1.py \
            --snapshot .repo-coordinator/snapshot.json \
            --policy .repo-coordinator/policy.main.json \
            "${STATE_ARGS[@]}" \
            --output .repo-coordinator/index.json \
            --markdown .repo-coordinator/index.md
          cat .repo-coordinator/index.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build degraded index when live snapshot is unavailable
        if: steps.snapshot.outcome != 'success'
        run: |
          mkdir -p .repo-coordinator
          cat > .repo-coordinator/index.json <<'JSON'
          {
            "schema_version": "0.2",
            "degraded": true,
            "reason": "LIVE_REPOSITORY_SNAPSHOT_UNAVAILABLE",
            "authority_effect": "NONE"
          }
          JSON
          cat > .repo-coordinator/index.md <<'MD'
          <!-- repository-coordinator -->
          ## Repository Coordinator — degraded index

          Live repository projection is temporarily unavailable because the GitHub snapshot read failed.

          **Integrity behavior:** the required admission/backpressure gate (`repository-admission-gate.yml`) evaluates independently from the default branch and fails closed. Global capacity/competition guidance is withheld here rather than guessed.

          `GUIDANCE_REQUIRES_EVIDENCE · ADMISSION_IS_NOT_MERGE_AUTHORITY`
          MD
          cat .repo-coordinator/index.md >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare safe comment payload
        id: report
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          text = Path(".repo-coordinator/index.md").read_text(encoding="utf-8")
          encoded = base64.b64encode(text.encode()).decode()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"report_b64={encoded}\n")
          PY

      - name: Upload coordination index
        uses: actions/upload-artifact@v7
        with:
          name: repository-coordinator-index
          path: |
            .repo-coordinator/snapshot.json
            .repo-coordinator/ADMISSION_LEDGER.jsonl
            .repo-coordinator/COORDINATOR_STATE.json
            .repo-coordinator/index.json
            .repo-coordinator/index.md
          retention-days: 30
          if-no-files-found: ignore

  comment:
    name: Publish advisory index on triggering PR
    if: github.event_name == 'pull_request'
    needs: index
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      # Deliberately no checkout and no PR-head execution in this write-capable job.
      - uses: actions/github-script@v9
        env:
          REPORT_B64: ${{ needs.index.outputs.report_b64 }}
        with:
          script: |
            const marker = "<!-- repository-coordinator -->";
            let body = Buffer.from(process.env.REPORT_B64 || "", "base64")
              .toString("utf8");
            if (!body.includes(marker)) {
              body = marker + "\n## Repository Coordinator\n\nInvalid report marker; advisory output withheld.";
            }
            if (body.length > 60000) {
              body = body.slice(0, 59500) + "\n\n_Report truncated; see workflow artifact._";
            }
            const headSha = (context.payload.pull_request || {}).head?.sha || "unknown";
            body += "\n\n_Advisory index computed by the coordinator at PR head `"
              + headSha.slice(0, 12)
              + "` against the default-branch policy. Enforcement is the separate "
              + "`Repository admission/backpressure gate` check, which runs from the default branch._";

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find(c =>
              c.user && c.user.type === "Bot" &&
              typeof c.body === "string" &&
              c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
            }


  candidate_state_contract:
    name: Validate candidate state contract (READ-ONLY)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Fetch exact coordinator state for candidate policy
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const policy = JSON.parse(
              fs.readFileSync("REPOSITORY_COORDINATOR_POLICY.json", "utf8")
            );
            const cfg = policy.state_source || {};
            if (!cfg.branch || !cfg.ledger_path || !cfg.projection_path) {
              core.setFailed("Candidate policy does not declare a complete state_source.");
              return;
            }
            const branch = await github.rest.repos.getBranch({
              owner, repo, branch: String(cfg.branch)
            });
            const stateHead = branch.data.commit.sha;
            const readAt = async path => {
              const response = await github.rest.repos.getContent({
                owner, repo, path, ref: stateHead
              });
              if (Array.isArray(response.data) || !response.data.content) {
                throw new Error(`expected file at ${path}@${stateHead}`);
              }
              return Buffer.from(response.data.content, "base64").toString("utf8");
            };
            const [ledgerText, stateText] = await Promise.all([
              readAt(String(cfg.ledger_path)),
              readAt(String(cfg.projection_path))
            ]);
            fs.mkdirSync(".repo-coordinator", { recursive: true });
            fs.writeFileSync(".repo-coordinator/ADMISSION_LEDGER.jsonl", ledgerText);
            fs.writeFileSync(".repo-coordinator/COORDINATOR_STATE.json", stateText);
            fs.writeFileSync(".repo-coordinator/state-head", stateHead + "\n");

      - name: Replay and verify real bootstrap ledger
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          from repository_coordinator_v0_1 import validate_coordinator_state

          ledger = Path(".repo-coordinator/ADMISSION_LEDGER.jsonl").read_text(encoding="utf-8")
          state = json.loads(
              Path(".repo-coordinator/COORDINATOR_STATE.json").read_text(encoding="utf-8")
          )
          validated = validate_coordinator_state(ledger, state)
          assert validated["ledger_event_count"] == 25
          assert len(validated["admitted_issue_numbers"]) == 2
          assert len(validated["admitted_pull_request_numbers"]) == 23
          assert validated["merge_authority"] is False
          print(
              "PASS real coordinator-state bootstrap:",
              f"events={validated['ledger_event_count']}",
              f"issues={len(validated['admitted_issue_numbers'])}",
              f"prs={len(validated['admitted_pull_request_numbers'])}",
          )
          PY

  state_mutation:
    name: Apply authorized issue admission event
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Prepare authorized issue-route event
        id: prepare
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ACTOR: ${{ github.event.comment.user.login }}
          COMMENT_CREATED_AT: ${{ github.event.comment.created_at }}
        with:
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const policyText = fs.readFileSync("REPOSITORY_COORDINATOR_POLICY.json", "utf8");
            const policy = JSON.parse(policyText);
            const cfg = policy.state_mutation || {};
            const commands = cfg.commands || {};
            const body = String(process.env.COMMENT_BODY || "").trim();
            const actor = String(process.env.COMMENT_ACTOR || "");
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const commentId = String(process.env.COMMENT_ID || "");
            const action =
              body === String(commands.admit || "") ? "ADMIT" :
              body === String(commands.revoke || "") ? "REVOKE" :
              null;

            if (!action) {
              core.notice("Issue comment is not a coordinator state command; no mutation.");
              core.setOutput("should_run", "false");
              return;
            }

            const authorized = new Set((cfg.authorized_actors || []).map(String));
            if (!authorized.has(actor)) {
              core.setFailed(`@${actor} is not authorized to mutate coordinator state.`);
              return;
            }
            if (cfg.subject_kind !== "ISSUE" || cfg.merge_authority !== false) {
              core.setFailed("Unsupported or unsafe state_mutation policy.");
              return;
            }

            const stateCfg = policy.state_source || {};
            const stateBranch = String(stateCfg.branch || "");
            const ledgerPath = String(stateCfg.ledger_path || "");
            const projectionPath = String(stateCfg.projection_path || "");
            if (!stateBranch || !ledgerPath || !projectionPath) {
              core.setFailed("Coordinator state source is incomplete.");
              return;
            }

            const branchResp = await github.rest.repos.getBranch({
              owner, repo, branch: stateBranch
            });
            const oldHead = branchResp.data.commit.sha;

            const readAt = async path => {
              const response = await github.rest.repos.getContent({
                owner, repo, path, ref: oldHead
              });
              if (Array.isArray(response.data) || !response.data.content) {
                throw new Error(`expected file at ${path}@${oldHead}`);
              }
              return Buffer.from(response.data.content, "base64").toString("utf8");
            };

            const [ledgerText, stateText] = await Promise.all([
              readAt(ledgerPath),
              readAt(projectionPath)
            ]);
            const state = JSON.parse(stateText);
            const key = `ISSUE#${issueNumber}`;
            const activeEvent = (state.active_event_ids || {})[key] || null;

            if (action === "ADMIT" && activeEvent) {
              core.notice(`Issue #${issueNumber} is already admitted by ${activeEvent}; no-op.`);
              core.setOutput("should_run", "false");
              return;
            }
            if (action === "REVOKE" && !activeEvent) {
              core.notice(`Issue #${issueNumber} is not currently admitted; no-op.`);
              core.setOutput("should_run", "false");
              return;
            }

            const event = {
              actor,
              authority_effect: "ADMISSION_ROUTING_ONLY",
              decision: action,
              event_id: `RCSEVT-COMMENT-${commentId}`,
              evidence: [
                `Authorized issue comment command ${body} on issue #${issueNumber}.`,
                `GitHub issue comment id ${commentId} by @${actor}.`
              ],
              lane: "WORKING_SET",
              merge_authority: false,
              objective_issue_number: issueNumber,
              recorded_at: String(process.env.COMMENT_CREATED_AT || ""),
              schema: "humanaios.repository-coordinator-event.v1",
              source_policy_sha: context.sha,
              subject_kind: "ISSUE",
              subject_number: issueNumber,
              supersedes_event_id: action === "REVOKE" ? activeEvent : null
            };

            fs.mkdirSync(".repo-coordinator", { recursive: true });
            fs.writeFileSync(".repo-coordinator/ADMISSION_LEDGER.jsonl", ledgerText);
            fs.writeFileSync(".repo-coordinator/COORDINATOR_STATE.json", stateText);
            fs.writeFileSync(
              ".repo-coordinator/event.json",
              JSON.stringify(event, null, 2) + "\n"
            );

            core.setOutput("should_run", "true");
            core.setOutput("old_head", oldHead);
            core.setOutput("state_branch", stateBranch);
            core.setOutput("ledger_path", ledgerPath);
            core.setOutput("projection_path", projectionPath);
            core.setOutput("action", action);
            core.setOutput("issue_number", String(issueNumber));

      - name: Replay ledger and materialize new state
        if: steps.prepare.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          python3 tools/repository_coordinator_v0_1.py \
            --ledger .repo-coordinator/ADMISSION_LEDGER.jsonl \
            --state .repo-coordinator/COORDINATOR_STATE.json \
            --append-event-json .repo-coordinator/event.json \
            > .repo-coordinator/mutation-result.json

      - name: Atomically advance coordinator-state branch
        if: steps.prepare.outputs.should_run == 'true'
        uses: actions/github-script@v9
        env:
          OLD_HEAD: ${{ steps.prepare.outputs.old_head }}
          STATE_BRANCH: ${{ steps.prepare.outputs.state_branch }}
          LEDGER_PATH: ${{ steps.prepare.outputs.ledger_path }}
          PROJECTION_PATH: ${{ steps.prepare.outputs.projection_path }}
          ACTION: ${{ steps.prepare.outputs.action }}
          ISSUE_NUMBER: ${{ steps.prepare.outputs.issue_number }}
        with:
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const oldHead = String(process.env.OLD_HEAD);
            const stateBranch = String(process.env.STATE_BRANCH);
            const ledgerPath = String(process.env.LEDGER_PATH);
            const projectionPath = String(process.env.PROJECTION_PATH);
            const ledgerText = fs.readFileSync(".repo-coordinator/ADMISSION_LEDGER.jsonl", "utf8");
            const stateText = fs.readFileSync(".repo-coordinator/COORDINATOR_STATE.json", "utf8");

            // Re-read the branch immediately before constructing the commit.
            // A mismatch is a lease failure; never overwrite concurrent state.
            const live = await github.rest.repos.getBranch({
              owner, repo, branch: stateBranch
            });
            if (live.data.commit.sha !== oldHead) {
              core.setFailed(
                `coordinator state advanced from ${oldHead} to ${live.data.commit.sha}; retry command`
              );
              return;
            }

            const parent = await github.rest.git.getCommit({
              owner, repo, commit_sha: oldHead
            });
            const [ledgerBlob, stateBlob] = await Promise.all([
              github.rest.git.createBlob({
                owner, repo, content: ledgerText, encoding: "utf-8"
              }),
              github.rest.git.createBlob({
                owner, repo, content: stateText, encoding: "utf-8"
              })
            ]);
            const tree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: parent.data.tree.sha,
              tree: [
                { path: ledgerPath, mode: "100644", type: "blob", sha: ledgerBlob.data.sha },
                { path: projectionPath, mode: "100644", type: "blob", sha: stateBlob.data.sha }
              ]
            });
            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message: `coordinator-state: ${process.env.ACTION} issue #${process.env.ISSUE_NUMBER}`,
              tree: tree.data.sha,
              parents: [oldHead]
            });

            // force=false makes a concurrent branch advance reject this update
            // rather than overwrite history.
            await github.rest.git.updateRef({
              owner,
              repo,
              ref: `heads/${stateBranch}`,
              sha: commit.data.sha,
              force: false
            });
            core.summary
              .addHeading("Repository Coordinator state mutation")
              .addRaw(`Issue #${process.env.ISSUE_NUMBER}: ${process.env.ACTION}\n\n`)
              .addRaw(`State branch: ${stateBranch}\n\n`)
              .addRaw(`Previous head: ${oldHead}\n\n`)
              .addRaw(`New head: ${commit.data.sha}\n`)
              .write();
