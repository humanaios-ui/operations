# Candidate-code functional test, NOT an independent security or admission gate.
# pull_request executes candidate-controlled tests and this workflow is editable
# by the PR. No privileged secrets/tokens are passed to those tests. Trusted
# default-branch security/admission checks and Z2 review remain separate.
name: INTENT-OS collaboration boundary

on:
  pull_request:
    paths:
      - 'board/collaboration.mjs'
      - 'board/collaboration.test.mjs'
      - 'board/collaboration-ui.test.mjs'
      - 'board/worker.mjs'
      - 'board/worker.test.mjs'
      - 'tests/test_intent_os_collaboration_browser.py'
      - 'ui/intent-os-collaboration.html'
      - 'ui/intent-os-collaboration.js'
      - 'schemas/intent_os_collaboration_capsule_v0_1.schema.json'
      - '.github/workflows/intent-os-collaboration.yml'
  push:
    branches: [main]
    paths:
      - 'board/collaboration.mjs'
      - 'board/collaboration.test.mjs'
      - 'board/collaboration-ui.test.mjs'
      - 'board/worker.mjs'
      - 'board/worker.test.mjs'
      - 'tests/test_intent_os_collaboration_browser.py'
      - 'ui/intent-os-collaboration.html'
      - 'ui/intent-os-collaboration.js'
      - 'schemas/intent_os_collaboration_capsule_v0_1.schema.json'
      - '.github/workflows/intent-os-collaboration.yml'

permissions:
  contents: read

jobs:
  boundary-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          python3 -m pip install --quiet pytest playwright
          python3 -m playwright install --with-deps chromium
      - name: Existing Access gate regression
        run: node board/worker.test.mjs
      - name: Delegated-collaboration contract
        run: node board/collaboration.test.mjs
      - name: Browser surface safety contract
        run: node board/collaboration-ui.test.mjs
      - name: Two-user browser handoff
        run: python3 -m pytest tests/test_intent_os_collaboration_browser.py -q -rs
      - name: Parse capsule schema
        run: python3 -m json.tool schemas/intent_os_collaboration_capsule_v0_1.schema.json >/dev/null
