name: Wardens persistent lineage + Discord prototype tests

on:
  pull_request:
    paths:
      - 'experiments/wardens-lineage/**'
      - '.github/workflows/wardens-lineage-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lineage-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install prototype dependencies
        working-directory: experiments/wardens-lineage
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Assert syntax
        working-directory: experiments/wardens-lineage
        run: python -m compileall -q .
      - name: Test restart, scope, consent and Discord boundary
        working-directory: experiments/wardens-lineage
        run: python -m pytest -q
