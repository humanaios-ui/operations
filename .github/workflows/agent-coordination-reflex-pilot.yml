# Candidate-only functional test; NOT a trusted admission or security gate.
# All human ratification, coordinator admission and protected-branch gates remain separate.
name: Agent coordination reflex pilot
on:
  pull_request:
    paths:
      - 'agent_coordination/reflex.py'
      - 'agent_coordination/acat_loop.py'
      - 'tests/test_agent_coordination_reflex.py'
      - 'tests/test_agent_coordination_acat_loop.py'
      - 'docs/AGENT_COORDINATION_REFLEX_PILOT.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.codex/AGENTS.md'
      - '.github/copilot-instructions.md'
      - '.github/workflows/agent-coordination-reflex-pilot.yml'
  push:
    branches: [main]
    paths:
      - 'agent_coordination/reflex.py'
      - 'agent_coordination/acat_loop.py'
      - 'tests/test_agent_coordination_reflex.py'
      - 'tests/test_agent_coordination_acat_loop.py'
      - '.github/workflows/agent-coordination-reflex-pilot.yml'

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify syntax
        run: python3 -m py_compile agent_coordination/reflex.py agent_coordination/acat_loop.py tests/test_agent_coordination_reflex.py tests/test_agent_coordination_acat_loop.py
      - name: Deterministic offline tests
        run: python3 -m unittest discover -s tests -p 'test_agent_coordination_*.py' -v
