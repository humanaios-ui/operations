name: smag-capture

# MECHANICAL SMAG capture (no LLM, no human notification). On every merged PR,
# derive predicted/measured/substrate and post one row as a comment on the
# SMAG pilot ledger tracking issue (conflict-free, append-only, no main push).
# The optional LLM-review layer (claude-review.yml) enriches the `gap` field later.

# Frozen by Q-AGENT-WORKFLOWS-01 W7 (2026-11-26): red merges rose from 26% (Sep)
# to 74% (Nov) while SMAG ran, and no agent reads its lessons. The ledger stays
# as read-only history. Restore `pull_request: types: [closed]` only when an
# agent is named as the reader of SMAG lessons.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: read

env:
  TRACKING_ISSUE: "103"   # 📊 SMAG pilot ledger (auto-capture sink)

jobs:
  capture:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main       # run main's script, not the merged PR head (no untrusted exec)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Capture SMAG row -> tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/smag_pr_autocapture_v1_0.py \
            --pr "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --tracking-issue "${TRACKING_ISSUE}"
