name: ACAT-R Second Runtime Fair Comparison
on:
  pull_request:
    paths:
      - 'experiments/acat_r_comparison/**'
      - '.github/workflows/acat-r-second-runtime-comparison.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare-gner-e1:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Run unmodified conventional suite and equal-input ACAT-R comparison
        run: python experiments/acat_r_comparison/study.py --run-owned-offline
      - name: Verify no authority and no false superiority
        run: |
          python - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path('acatr-gner-evidence/report.json').read_text())
          assert r['P2']['cases']==30 and r['P3']['byte_identical'] is True
          assert sorted(r['acatr_equal']['detected'])==sorted(r['conventional_equal']['detected'])
          assert r['acatr_detection_advantage_on_equal_inputs']==0
          assert r['measured_false_alarm_rate'].startswith('UNDETERMINED')
          assert r['can_authorize'] is False and r['authority_effect']=='NONE'
          assert r['admission']=='HOLD'
          print('ACAT_R_EQUAL_WORKLOAD_VALIDATION_PASS')
          PY
      - name: Preserve raw machine execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acat-r-gner-e1-second-runtime
          path: acatr-gner-evidence/
          if-no-files-found: warn
          retention-days: 14
