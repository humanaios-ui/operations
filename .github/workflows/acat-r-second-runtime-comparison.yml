name: ACAT-R Second Runtime Fair Comparison
on:
  pull_request:
    paths:
      - 'experiments/acat_r_comparison/**'
      - 'tools/gner_verify_e1.py'
      - 'tools/gner_notification_e0.py'
      - 'tests/test_gner_verify_e1.py'
      - 'tests/test_acat_r_gner_e1_study.py'
      - '.github/workflows/acat-r-second-runtime-comparison.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: acat-r-second-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare-gner-e1:
    name: Equal-workload GNER-E1 comparison (offline, no authority)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Harness regression tests (rubric gate, replay, evidence classes)
        run: python -m unittest tests/test_acat_r_gner_e1_study.py -v
      - name: Run study (BLOCKS with exit 2 until the human accepts the active rubric revision)
        run: |
          set +e
          python experiments/acat_r_comparison/study.py --run-owned-offline
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "study failed with exit $rc"; exit "$rc"
          fi
          echo "study exit code $rc (0 = ran under an accepted rubric, 2 = blocked, no runtime call)"
      - name: Verify gate behaviour, no authority, no false superiority, no unreviewed defect count
        run: |
          python - <<'PY'
          import json,pathlib
          ev=pathlib.Path('acatr-gner-evidence')
          PREDECLARED='19a182607ccfabb32b679d7d764652f4de4a90556faeb880419af0103ac6cc9a'
          REV1='6971fd8d2045f301cf31d79a99d5e04bdf101ed7db968d9ee15cacde9043cbf7'
          if (ev/'RUBRIC_BLOCKED.json').exists():
              b=json.loads((ev/'RUBRIC_BLOCKED.json').read_text())
              assert b['status'] in ('BLOCKED_RUBRIC_NOT_HUMAN_ACCEPTED','BLOCKED_RUBRIC_DIGEST_MISMATCH')
              assert b['predeclared_rubric_sha256']==PREDECLARED
              assert b['computed_rubric_sha256']==REV1, 'rubric bytes changed without a registered revision'
              assert b['runtime_calls_made']==0 and b['conventional_suite_run'] is False
              assert b['admission']=='HOLD' and b['authority_effect']=='NONE'
              for f in ('P1_stdout.json','P2_stdout.json','P3_stdout.json','report.json','oracle_packet.json'):
                  assert not (ev/f).exists(), f'{f} must not exist when blocked'
              print('ACAT_R_RUBRIC_GATE_BLOCKED_AS_REQUIRED:', b['status'])
              raise SystemExit(0)
          r=json.loads((ev/'report.json').read_text())
          assert r['rubric_human_accepted'] is True and r['rubric_accepted_by']
          assert r['predeclared_digest_matches'] is False and r['predeclared_rubric_sha256']==PREDECLARED
          assert r['conventional_baseline']['passed'] is True and r['conventional_baseline']['ran_before_P1'] is True
          assert r['P2']['cases']==30 and r['P3']['byte_identical'] is True
          assert r['P3']['record_hashes_identical'] is True and r['P3']['id_order_identical'] is True
          assert sorted(r['acatr_equal']['detected'])==sorted(r['conventional_equal']['detected'])
          assert r['acatr_detection_advantage_on_equal_inputs']==0
          assert r['contract_derived_disagreements']==[]
          assert r['confirmed_defects']==len(r['adjudication_summary']['confirmed_defects'])
          assert set(r['adjudication_summary']['confirmed_defects'])<=set(r['acatr_equal']['detected'])
          assert r['measured_false_alarm_rate'].startswith('UNDETERMINED')
          assert r['can_authorize'] is False and r['authority_effect']=='NONE'
          assert r['admission']=='HOLD'
          p=json.loads((ev/'oracle_packet.json').read_text())
          assert len(p['cases'])==30 and all(c['reviewer_decision']=='PENDING' for c in p['cases'])  # generated template
          a=json.loads((ev/'oracle_adjudicated.json').read_text())
          assert len(a['cases'])==30
          print('ACAT_R_EQUAL_WORKLOAD_VALIDATION_PASS confirmed_defects=',r['confirmed_defects'],'pending=',a['summary']['pending'])
          PY
      - name: Preserve raw machine execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acat-r-gner-e1-second-runtime
          path: acatr-gner-evidence/
          if-no-files-found: warn
          retention-days: 14
