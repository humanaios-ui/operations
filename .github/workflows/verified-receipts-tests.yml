name: verified-receipts-tests

on:
  pull_request:
    paths:
      - "tools/verified_receipts.py"
      - "experiments/collab_harmony_01/**"
      - ".claude/skills/pr-manager/bridge_receipt_feed.py"
      - ".claude/skills/pr-manager/evidence_validator.py"
      - ".claude/skills/pr-manager/mutual_understanding_v0_1.py"
      - "tests/test_verified_receipts.py"
      - "tests/test_interrogation_receipt_gate.py"
      - ".github/workflows/verified-receipts-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receipt-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Resolver smoke test
        run: python3 tools/verified_receipts.py --smoke-test
      - name: Generic receipt resolver tests
        run: |
          if [ -f tests/test_verified_receipts.py ]; then
            python3 -m unittest tests.test_verified_receipts
          fi
      - name: Harmony receipt integration tests
        run: |
          if [ -f experiments/collab_harmony_01/test_harmony_stress.py ]; then
            python3 -m unittest experiments.collab_harmony_01.test_harmony_stress
          fi
      - name: Interrogation receipt integration tests
        run: |
          if [ -f tests/test_interrogation_receipt_gate.py ]; then
            python3 -m unittest tests.test_interrogation_receipt_gate
          fi
