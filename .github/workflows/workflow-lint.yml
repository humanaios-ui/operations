name: workflow-lint

# A workflow whose YAML GitHub cannot parse does not error loudly — it produces
# a run that completes in zero seconds with zero jobs and conclusion=failure,
# which reads in the Actions list exactly like a gate that ran and failed.
# z2_ratification_gate.yml was in that state for all 122 of its runs, from its
# first commit onward, because of a duplicate top-level `name:` key. Nothing
# noticed, because the governance docs described what the gate enforced rather
# than checking that it ran.
#
# ADVISORY on purpose. Four workflows are defective on main right now
# (drift-monitor, sonarcloud-baseline-auto, weekly-funding-rescore,
# weekly-profile-sync). Shipping this as a blocking gate would fail every PR
# on defects it did not introduce — the same reason Q-TOOLCONTROL-02 promoted
# its category rule only after the count reached zero. Promote this to
# blocking once these four are repaired.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  parse:
    runs-on: ubuntu-latest
    name: Workflows parse as GitHub reads them (ADVISORY)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install --quiet pyyaml

      - name: Every workflow parses, with no duplicate keys
        run: |
          python3 - <<'PY'
          import glob, sys, yaml

          class Strict(yaml.SafeLoader):
              """GitHub rejects duplicate mapping keys; PyYAML silently keeps the last."""

          def no_dup(loader, node, deep=False):
              out = {}
              for k, v in node.value:
                  key = loader.construct_object(k, deep=deep)
                  if key in out:
                      raise ValueError(f"duplicate key {key!r}")
                  out[key] = loader.construct_object(v, deep=deep)
              return out

          Strict.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, no_dup)

          files = sorted(glob.glob(".github/workflows/*.yml")
                         + glob.glob(".github/workflows/*.yaml"))
          bad = []
          for path in files:
              try:
                  doc = yaml.load(open(path, encoding="utf-8"), Strict)
              except Exception as exc:
                  bad.append((path, str(exc).split("\n")[0].strip()))
                  continue
              if not isinstance(doc, dict):
                  bad.append((path, "top level is not a mapping"))
              # PyYAML resolves a bare `on:` key to the boolean True.
              elif True not in doc and "on" not in doc:
                  bad.append((path, "no `on:` trigger — the workflow can never fire"))

          for path, why in bad:
              print(f"::warning file={path}::{why} — GitHub will create zero-job "
                    f"runs that look like failures but never execute a step")
          print(f"\nworkflow-lint: {len(files) - len(bad)}/{len(files)} parse cleanly.")
          if bad:
              print(f"{len(bad)} defective. Advisory for now; see workflow-lint.yml "
                    f"for the promotion condition.")
          PY

      - name: Has each gate ever actually fired? (ADVISORY)
        # Parsing proves a workflow CAN run. It does not prove the gate can
        # reject anything. A control that has succeeded 191 times and never
        # once failed is not demonstrably a control — it may be incapable of
        # failing, and nothing in the repository would say so.
        #
        # This reads run history and sorts every workflow into:
        #   DEAD        every sampled run finished with zero jobs — invalid YAML
        #   NEVER RAN   no runs at all; the trigger has never matched
        #   NEVER GREEN runs, always fails — broken, not enforcing
        #   NEVER FAILED runs, never rejected — unproven; may be decoration
        #   FIRES BOTH  has both passed and failed — demonstrably capable
        #
        # Advisory, and staying advisory: "never failed" is a suspicion, not a
        # defect. A workflow whose job is to publish a page SHOULD never fail.
        # The output is a prompt to check, not a verdict.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, collections

          REPO = os.environ.get("GITHUB_REPOSITORY", "humanaios-ui/operations")
          TOKEN = os.environ.get("GH_TOKEN", "")

          def api(path):
              cmd = ["curl", "-sS", "-H", "Accept: application/vnd.github+json"]
              if TOKEN:
                  cmd += ["-H", f"Authorization: Bearer {TOKEN}"]
              cmd.append(f"https://api.github.com/repos/{REPO}/{path}")
              try:
                  return json.loads(subprocess.run(cmd, capture_output=True,
                                                   text=True, timeout=30).stdout)
              except Exception:
                  return {}

          workflows = [w for w in api("actions/workflows?per_page=100").get("workflows", [])
                       if w.get("path", "").startswith(".github/workflows/")]
          if not workflows:
              print("::warning::could not read workflow list — skipping the firing audit")
              raise SystemExit(0)

          rows = []
          for w in workflows:
              data = api(f"actions/workflows/{w['id']}/runs?per_page=100")
              runs = data.get("workflow_runs", [])
              counts = collections.Counter(r.get("conclusion") for r in runs)
              # created == updated means the run finished without starting a job:
              # the signature of a workflow GitHub refused to parse.
              zero = sum(1 for r in runs if r.get("created_at") == r.get("updated_at"))
              ok, bad = counts.get("success", 0), counts.get("failure", 0)
              if not runs:
                  verdict = "NEVER RAN"
              elif zero == len(runs):
                  verdict = "DEAD"
              elif ok == 0 and bad:
                  verdict = "NEVER GREEN"
              elif bad == 0 and ok:
                  verdict = "NEVER FAILED"
              else:
                  verdict = "FIRES BOTH"
              rows.append((verdict, w["path"].split("/")[-1],
                           data.get("total_count", 0), ok, bad, zero))

          rank = {"DEAD": 0, "NEVER RAN": 1, "NEVER GREEN": 2,
                  "NEVER FAILED": 3, "FIRES BOTH": 4}
          rows.sort(key=lambda r: (rank[r[0]], -r[2]))

          print(f"{'verdict':<13}{'workflow':<42}{'runs':>6}{'ok':>5}{'fail':>6}{'0job':>6}")
          print("-" * 78)
          for verdict, name, total, ok, bad, zero in rows:
              print(f"{verdict:<13}{name:<42}{total:>6}{ok:>5}{bad:>6}{zero:>6}")

          tally = collections.Counter(r[0] for r in rows)
          unproven = sum(tally[k] for k in ("DEAD", "NEVER RAN", "NEVER GREEN", "NEVER FAILED"))
          # The annotation body must name the workflow itself. GitHub does not
          # render the `file=` parameter into the raw log, so the first version
          # of this printed "551 runs, every sampled one with zero jobs" with no
          # indication of WHICH gate — a warning nobody can act on. Caught by
          # reading this step's own first CI run rather than trusting its exit code.
          for verdict, name, total, ok, bad, zero in rows:
              if verdict == "DEAD":
                  print(f"::warning file=.github/workflows/{name}::{name}: {total} runs, "
                        f"every sampled one with zero jobs — this gate has never executed "
                        f"a step")
              elif verdict == "NEVER GREEN":
                  print(f"::warning file=.github/workflows/{name}::{name}: {total} runs, "
                        f"never green — it is failing, not enforcing")
          print(f"\nfiring audit: {tally['FIRES BOTH']}/{len(rows)} workflows have both "
                f"passed and failed. {unproven} have not demonstrated they can reject "
                f"anything ({tally['DEAD']} dead, {tally['NEVER RAN']} never ran, "
                f"{tally['NEVER GREEN']} never green, {tally['NEVER FAILED']} never failed).")
          print("Advisory. 'Never failed' is a prompt to check whether the gate CAN fail, "
                "not a claim that it cannot.")
          PY
