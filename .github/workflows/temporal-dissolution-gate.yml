name: temporal-dissolution-gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  temporal-dissolution:
    name: Reject unauthorized internal deadline semantics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unit-test temporal gate
        run: python -m unittest tests.test_temporal_dissolution_gate

      - name: Scan added control-surface lines
        run: python tools/temporal_dissolution_gate.py --base-ref "${{ github.base_ref }}"
