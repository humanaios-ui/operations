name: Witness E3 corrected snapshot integration

on:
  pull_request:
    paths:
      - 'services/haios_mcp/**'
      - '.github/workflows/witness-e3-corrected-miner.yml'

permissions:
  contents: read

jobs:
  e3-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Witness candidate (PR #1012)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            services/haios_mcp
            CURRENT.md
            REGISTERED.md
            GOVERNANCE.md

      - name: Checkout corrected Resource Miner candidate (PR #993, exact reviewed head)
        uses: actions/checkout@v4
        with:
          repository: humanaios-ui/operations
          ref: ad64d638d4724a233f42b0cd58710b95238cda05
          path: e3-miner
          persist-credentials: false
          sparse-checkout: |
            humanaios-funding-pipeline/resource-miner
            humanaios-funding-pipeline/data

      - name: Set up isolated Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bounded Witness MCP test dependencies
        run: python -m pip install -e ./services/haios_mcp

      - name: Run offline E2/E3 tests from clean checked-out package
        run: python -m unittest discover -s services/haios_mcp/tests -v

      - name: Run E3 corrected-branch real snapshot through MCP
        run: |
          python services/haios_mcp/scripts/smoke_e3_ci.py \
            --miner-root e3-miner/humanaios-funding-pipeline/resource-miner \
            --witness-root .

  rollback-macos-fixture:
    runs-on: macos-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout PR exact commit without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            services/haios_mcp

      - name: Use Python 3.13 for native macOS checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run disposable ownership/process/rollback negative fixtures
        run: |
          python -m unittest discover \
            -s services/haios_mcp/tests \
            -p test_pilot_rollback_guard.py -v

      - name: Check fail-closed macOS staging and installer negative fixtures
        run: |
          python -m unittest discover \
            -s services/haios_mcp/tests \
            -p test_pilot_stage_guard.py -v

      - name: Native macOS process liveness and read-only rollback check
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(cd "$(mktemp -d)" && pwd -P)"
          child=""
          trap 'if [[ -n "$child" ]]; then kill "$child" >/dev/null 2>&1 || true; wait "$child" >/dev/null 2>&1 || true; fi; /bin/rm -R "$TMP"' EXIT
          BASE="$TMP/Library/Application Support/HumanAIOS"
          PILOT="$BASE/witness-pilot-e03-z1"
          CONTEXT="$BASE/witness-pilot-e03-context"
          /bin/mkdir -p "$PILOT" "$CONTEXT"
          printf 'E0.3 Witness pilot, not released\n' > "$PILOT/.witness-pilot-e03-z1"
          printf 'E0.3 Witness public context snapshot\n' > "$CONTEXT/.witness-pilot-e03-z1"
          SCRIPT="services/haios_mcp/scripts/pilot_rollback_guard.py"
          HOME="$TMP" python "$SCRIPT"
          (cd "$PILOT" && exec /bin/sleep 30) &
          child=$!
          /bin/sleep 1
          if HOME="$TMP" python "$SCRIPT"; then
            echo "FAIL: live process was not detected"; exit 1
          fi
          kill "$child" >/dev/null 2>&1 || true
          wait "$child" >/dev/null 2>&1 || true
          child=""
          HOME="$TMP" python "$SCRIPT"
          echo "MACOS FIXTURE PASS: live pilot refused; clean marker check passed."
