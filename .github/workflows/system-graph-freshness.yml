name: system-graph-freshness

# Keeps system_graph.json from going stale silently (it sat unregenerated from
# 2026-09-13 while the generator itself failed validation).
#   - PR/push: generator must be valid and committed JSON must equal generator output.
#   - Weekly schedule: also fail if generated_at is older than 45 days, and open
#     (or comment on) a tracking issue. It does NOT auto-commit: system_graph.json
#     is a Z2-ratified file, so regeneration goes through a Z1 PR.

on:
  pull_request:
    paths:
      - 'system_graph_generator.py'
      - 'system_graph.json'
      - 'docs/SYSTEM_GRAPH.md'
      - 'tools/tests/test_system_graph_generator.py'
      - '.github/workflows/system-graph-freshness.yml'
  push:
    branches: [main]
    paths:
      - 'system_graph_generator.py'
      - 'system_graph.json'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install deps
        run: python3 -m pip install --quiet pytest pyyaml

      - name: Unit tests
        run: python3 -m pytest tools/tests/test_system_graph_generator.py -q

      - name: Graph valid and equal to generator output
        run: python3 system_graph_generator.py --check

      - name: Rendered view in sync
        run: python3 tools/system_graph_render_v1_0.py --check docs/SYSTEM_GRAPH.md

      - name: Age limit (scheduled runs only)
        id: age
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 system_graph_generator.py --check --max-age-days 45

      - name: Open tracking issue on stale graph
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'system_graph.json is stale — regenerate via Z1 PR';
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const body = `Scheduled freshness check failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
              'Fix: `python3 system_graph_generator.py --write && python3 tools/system_graph_render_v1_0.py --out docs/SYSTEM_GRAPH.md`, ' +
              'add nodes for work that landed since the last generation, open a Z1 PR for Z2 ratification.';
            const existing = open.find(i => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
