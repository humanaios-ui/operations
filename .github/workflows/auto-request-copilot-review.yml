name: Legacy Copilot review request (disabled)

# Disabled 2026-09-30 after Copilot PR review became unavailable as a paid
# dependency. Independent review is moving to CodeRabbit OSS under Issue #602.
#
# This file is intentionally preserved as provenance for the recursive review
# loop. It no longer runs automatically and must not be treated as an active
# review surface.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Record disabled reviewer path
        run: |
          echo "Copilot auto-review path is disabled."
          echo "See Issue #602 and .coderabbit.yaml for the replacement review substrate."
