version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - security

  - package-ecosystem: pip
    directory: /orcid-publications-manager
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - security

  - package-ecosystem: pip
    directory: /tools/Metaculus
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - security

  - package-ecosystem: pip
    directory: /humanaios-funding-pipeline
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - security

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 4
    groups:
      routine-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      major-actions:
        patterns:
          - "*"
        update-types:
          - major
    labels:
      - dependencies
      - ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - fuzzing
